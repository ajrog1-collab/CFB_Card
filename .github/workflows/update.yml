name: Update model

on:
  schedule:
    # GitHub queues scheduled runs on shared capacity and documents that they can
    # be delayed — or dropped — when load is high, with the top of the hour being
    # the worst. Every time below is deliberately off :00, and the day gets two
    # attempts so a dropped run does not leave the board stale.
    - cron: "23 13 * * *"     # 13:23 UTC — 07:23 MT / 09:23 ET
    - cron: "47 16 * * *"     # 16:47 UTC — 10:47 MT / 12:47 ET, catches a miss
    # Saturday moves fastest, so two more passes toward kickoff
    - cron: "19 17 * * 6"
    - cron: "19 21 * * 6"
    - cron: "38 12 * * 0"     # Sunday, grade the weekend
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-model
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run college model
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          PYTHONUNBUFFERED: "1"     # stream progress live instead of buffering
        run: python -u cfb/run.py

      # Separate step so a failure in one sport still leaves the other updated,
      # and the log makes it obvious which one broke.
      - name: Run pro model
        if: always()
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u cfb/nfl_run.py

      - name: Commit results
        if: always()          # keep partial cache even if the run timed out
        run: |
          git config user.name  "cfb-model-bot"
          git config user.email "actions@github.com"
          git add docs/data.json data/
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update model: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
