<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141b26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141b26; --panel:#1b2532; --panel-2:#222e3d; --rule:#2c3a4c;
    --paper:#e9e7e2; --muted:#8b9aad; --brass:#c8973f; --cool:#5b9fcf;
    --win:#4e9a6b; --loss:#b4574f; --push:#7d8794;
    --display:'Barlow Condensed',Impact,sans-serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--paper);font-family:var(--body);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    padding:0 0 env(safe-area-inset-bottom)}
  .wrap{max-width:680px;margin:0 auto;padding:0 14px 60px}

  header{padding:20px 0 12px}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted)}
  h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:.92;
    margin:3px 0 0;text-transform:uppercase}
  h1 .accent{color:var(--brass)}
  .stamp{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px}

  .summary{display:flex;gap:7px;margin:12px 0 0}
  .sum{flex:1;background:var(--panel);border-radius:2px;padding:9px 10px;text-align:center}
  .sum-v{font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
  .sum-v.brass{color:var(--brass)}
  .sum-v.pos{color:var(--win)} .sum-v.neg{color:var(--loss)}
  .sum-k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin-top:3px}

  nav{display:flex;gap:2px;margin:14px 0 0;position:sticky;top:0;z-index:30;
    background:var(--ink);padding:8px 0;border-bottom:1px solid var(--rule)}
  .tab{flex:1;appearance:none;border:0;cursor:pointer;background:var(--panel);
    color:var(--muted);font-family:var(--display);font-size:15px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;padding:10px 2px;border-radius:2px;
    transition:background .15s,color .15s}
  .tab[aria-selected="true"]{background:var(--brass);color:#17202b}
  .tab:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
  .badge-n{font-family:var(--mono);font-size:10px;margin-left:4px;opacity:.85}
  .panel[hidden]{display:none}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
  .chip{appearance:none;border:1px solid var(--rule);background:transparent;
    color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;padding:6px 10px;border-radius:2px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s}
  .chip[aria-pressed="true"]{background:var(--brass);color:#17202b;border-color:var(--brass)}
  .chip:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
  .sortbar{display:flex;align-items:center;gap:8px;margin:8px 0 2px;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted)}
  .sortbar select{background:var(--panel);color:var(--paper);border:1px solid var(--rule);
    border-radius:2px;font-family:var(--mono);font-size:11px;padding:5px 7px}
  .count{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}

  .card{background:var(--panel);border-radius:2px;margin:9px 0;padding:11px 12px 11px 0;
    display:flex;position:relative;overflow:hidden}
  .card.qual .tick{background:var(--brass)}
  .card.top{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--brass)}
  .tick{width:3px;flex:none;background:var(--rule);margin-right:11px}
  .card-body{flex:1;min-width:0}
  .row1{display:flex;align-items:flex-start;gap:8px}
  .matchup{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.15;flex:1}
  .at{color:var(--muted);font-weight:500;padding:0 3px}
  .star{appearance:none;border:0;background:transparent;cursor:pointer;font-size:19px;
    line-height:1;color:var(--rule);padding:0 2px;flex:none;transition:color .15s}
  .star[aria-pressed="true"]{color:var(--brass)}
  .star:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
  .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:3px;
    display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .rank-chip{font-family:var(--display);font-size:12px;font-weight:700;
    background:var(--brass);color:#17202b;border-radius:1px;padding:1px 5px}
  .flag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);border:1px solid var(--rule);border-radius:1px;padding:1px 5px}
  .card.qual .flag{color:var(--brass);border-color:var(--brass)}

  .callout{display:flex;align-items:baseline;gap:8px;margin-top:9px;padding-top:9px;
    border-top:1px solid var(--rule)}
  .pick{font-family:var(--display);font-size:18px;font-weight:700;text-transform:uppercase}
  .pick-line{font-family:var(--mono);font-size:15px;color:var(--brass);font-weight:600}
  .numbers{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);
    text-align:right;flex:none}
  .numbers b{color:var(--paper);font-weight:500}

  .drivers{margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .driver{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;line-height:1.35}
  .dot{width:5px;height:5px;border-radius:50%;flex:none;margin-top:6px;background:var(--cool)}
  .dot.caution{background:var(--loss)}
  .dot.weather,.dot.travel,.dot.rest{background:var(--brass)}
  .driver.caution{color:var(--muted)}

  .meter{margin-top:9px;height:22px;position:relative}
  .meter-line{position:absolute;left:0;right:0;top:14px;height:1px;background:var(--rule)}
  .meter-mkt,.meter-mod{position:absolute;top:8px;width:2px;height:13px}
  .meter-mkt{background:var(--cool)}
  .meter-mod{background:var(--brass)}
  .meter-lab{position:absolute;top:0;font-family:var(--mono);font-size:9px}
  .meter-lab.mkt{color:var(--cool)}
  .meter-lab.mod{color:var(--brass);right:0;text-align:right}

  .chart{background:var(--panel);border-radius:2px;padding:12px 12px 8px;margin:10px 0}
  .chart-t{font-family:var(--mono);font-size:10px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  svg{display:block;width:100%}

  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}
  .tile{background:var(--panel);border-radius:2px;padding:11px 10px}
  .tile-k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .tile-v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.05;margin-top:3px}
  .tile-v.pos{color:var(--win)} .tile-v.neg{color:var(--loss)}
  .tile-sub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:1px}

  .rrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)}
  .badge{font-family:var(--display);font-size:12px;font-weight:700;width:30px;flex:none;
    text-align:center;padding:3px 0;border-radius:1px}
  .badge.win{background:var(--win);color:#0f1a13}
  .badge.loss{background:var(--loss);color:#1e0f0e}
  .badge.push{background:var(--push);color:#14181d}
  .rmain{flex:1;min-width:0}
  .rpick{font-family:var(--display);font-size:16px;font-weight:600}
  .rsub{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:1px}

  h2{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;margin:20px 0 2px}
  h3{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;margin:18px 0 4px;color:var(--brass)}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 6px}
  .empty{background:var(--panel);border-radius:2px;padding:24px 16px;text-align:center;margin:10px 0}
  .empty-h{font-family:var(--display);font-size:20px;font-weight:600;text-transform:uppercase}
  .empty-p{font-size:13px;color:var(--muted);margin-top:5px}
  .note{background:var(--panel);border-left:3px solid var(--cool);padding:10px 12px;
    margin:10px 0;font-size:13px;border-radius:2px}
  .note.warn{border-left-color:var(--brass)}
  dl{margin:0}
  dt{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.03em;
    margin-top:13px;color:var(--paper)}
  dd{margin:3px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5}
  dd b{color:var(--paper);font-weight:500}
  a{color:var(--cool)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">College football model</div>
    <h1>The <span class="accent">Card</span></h1>
    <div class="stamp" id="stamp"></div>
  </header>

  <div class="summary" id="summary"></div>

  <nav role="tablist">
    <button class="tab" role="tab" id="t-board" aria-controls="p-board" aria-selected="true">Board</button>
    <button class="tab" role="tab" id="t-slip" aria-controls="p-slip" aria-selected="false">Slip</button>
    <button class="tab" role="tab" id="t-record" aria-controls="p-record" aria-selected="false">Record</button>
    <button class="tab" role="tab" id="t-model" aria-controls="p-model" aria-selected="false">Model</button>
  </nav>

  <section class="panel" id="p-board" role="tabpanel" aria-labelledby="t-board"></section>
  <section class="panel" id="p-slip" role="tabpanel" aria-labelledby="t-slip" hidden></section>
  <section class="panel" id="p-record" role="tabpanel" aria-labelledby="t-record" hidden></section>
  <section class="panel" id="p-model" role="tabpanel" aria-labelledby="t-model" hidden></section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sgn = n => (n > 0 ? '+' : '') + Number(n).toFixed(1);
const sgnInt = n => (n > 0 ? '+' : '') + Math.round(n);

let DATA = null;
const FAVS = new Set();               // in-memory only, clears on reload
const FILTERS = { market:'all', quality:'all' };
let SORT = 'confidence';

function kickText(iso){
  if(!iso) return '';
  const d = new Date(iso), hrs = (d - new Date()) / 36e5;
  const when = d.toLocaleDateString([], {weekday:'short'}) + ' ' +
               d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  return hrs < 24 ? `${when} · ${Math.max(0, Math.round(hrs))}h` : when;
}
const started = p => p.kickoff && new Date(p.kickoff) < new Date();

/* Finished and in-progress games drop off automatically. */
function allPicks(){
  const s = (DATA.picks || []).map(p => ({...p, market:'spread'}));
  const t = (DATA.total_picks || []).map(p => ({...p, market:'total',
    pick_spread:p.line, model_margin:p.model_total, market_margin:p.line}));
  return s.concat(t).filter(p => !started(p));
}

function visible(){
  let list = allPicks();
  if(FILTERS.market !== 'all') list = list.filter(p => p.market === FILTERS.market);
  if(FILTERS.quality === 'top') list = list.filter(p => p.top_pick);
  if(FILTERS.quality === 'qual') list = list.filter(p => p.qualified);
  const key = {
    confidence: p => -(p.confidence ?? 0),
    edge:       p => -Math.abs(p.edge ?? 0),
    kickoff:    p => new Date(p.kickoff || 0).getTime(),
  }[SORT];
  return list.sort((a,b) => key(a) - key(b));
}

/* Model number vs market number, side by side. */
function meter(p){
  if(p.market_margin == null || p.model_margin == null) return '';
  const lo = Math.min(p.market_margin, p.model_margin);
  const hi = Math.max(p.market_margin, p.model_margin);
  const pad = Math.max(4, (hi - lo) * 0.9);
  const a = lo - pad, b = hi + pad;
  const pos = v => ((v - a) / (b - a) * 100).toFixed(1);
  return `<div class="meter">
    <div class="meter-lab mkt">book ${esc(p.market_margin)}</div>
    <div class="meter-lab mod">model ${esc(p.model_margin)}</div>
    <div class="meter-line"></div>
    <div class="meter-mkt" style="left:${pos(p.market_margin)}%"></div>
    <div class="meter-mod" style="left:${pos(p.model_margin)}%"></div>
  </div>`;
}

function card(p, rank){
  const id = p.market + ':' + p.game_id;
  const fav = FAVS.has(id);
  const cls = p.top_pick ? 'top qual' : p.qualified ? 'qual' : '';
  const w = Math.min(3 + Math.abs(p.edge) * 0.8, 11).toFixed(1);
  const drivers = (p.drivers || []).map(d => `
    <div class="driver ${d.kind === 'caution' ? 'caution' : ''}">
      <span class="dot ${esc(d.kind)}"></span><span>${esc(d.text)}</span></div>`).join('');
  return `
  <div class="card ${cls}">
    <div class="tick" style="width:${w}px"></div>
    <div class="card-body">
      <div class="row1">
        <div class="matchup">${esc(p.away)}<span class="at">at</span>${esc(p.home)}</div>
        <button class="star" aria-pressed="${fav}" data-fav="${esc(id)}"
          aria-label="${fav ? 'Remove from slip' : 'Add to slip'}">${fav ? '★' : '☆'}</button>
      </div>
      <div class="meta">
        ${rank ? `<span class="rank-chip">#${rank}</span>` : ''}
        <span>${esc(kickText(p.kickoff))}</span>
        ${p.market === 'total' ? '<span>total</span>' : ''}
        ${p.confidence != null ? `<span>sure ${esc(p.confidence)}</span>` : ''}
        <span class="flag">${p.top_pick ? 'Top' : p.qualified ? 'Qualified' : 'Lean'}</span>
      </div>
      <div class="callout">
        <span class="pick">${esc(p.pick)}</span>
        <span class="pick-line">${p.market === 'total' ? esc(p.line) : sgn(p.pick_spread)}</span>
        <span class="numbers">gap <b>${sgn(p.edge)}</b></span>
      </div>
      ${meter(p)}
      ${drivers ? `<div class="drivers">${drivers}</div>` : ''}
    </div>
  </div>`;
}

function renderBoard(){
  const list = visible();
  const notes = (DATA.notes || []).map(n => `<div class="note warn">${esc(n)}</div>`).join('');
  const chip = (g, v, label) =>
    `<button class="chip" data-f="${g}" data-v="${v}" aria-pressed="${FILTERS[g]===v}">${label}</button>`;
  const controls = `
    <div class="filters">
      ${chip('quality','all','All')}${chip('quality','qual','Qualified')}${chip('quality','top','Top')}
      ${chip('market','all','Both')}${chip('market','spread','Sides')}${chip('market','total','Totals')}
    </div>
    <div class="sortbar">
      <label for="sortsel">Sort</label>
      <select id="sortsel">
        <option value="confidence"${SORT==='confidence'?' selected':''}>Most sure</option>
        <option value="edge"${SORT==='edge'?' selected':''}>Biggest gap</option>
        <option value="kickoff"${SORT==='kickoff'?' selected':''}>Kickoff</option>
      </select>
      <span class="count">${list.length} game${list.length===1?'':'s'}</span>
    </div>`;
  let rank = 0;
  const body = list.length
    ? list.map(p => card(p, p.top_pick ? ++rank : null)).join('')
    : `<div class="empty"><div class="empty-h">Nothing here</div>
       <div class="empty-p">No upcoming games match, or lines aren't posted yet.</div></div>`;
  $('p-board').innerHTML = notes + controls + body;
  wire($('p-board'));
}

function renderSlip(){
  const picks = allPicks().filter(p => FAVS.has(p.market + ':' + p.game_id));
  if(!picks.length){
    $('p-slip').innerHTML = `<div class="empty"><div class="empty-h">Slip is empty</div>
      <div class="empty-p">Tap ☆ on the board to shortlist games.</div></div>`;
    return;
  }
  const avg = picks.reduce((a,p) => a + Math.abs(p.edge), 0) / picks.length;
  $('p-slip').innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="tile-k">Games</div><div class="tile-v">${picks.length}</div></div>
      <div class="tile"><div class="tile-k">Avg gap</div><div class="tile-v">${avg.toFixed(1)}</div></div>
      <div class="tile"><div class="tile-k">Qualified</div>
        <div class="tile-v">${picks.filter(p => p.qualified).length}</div></div>
    </div>
    <button class="chip" id="clearslip" style="margin:4px 0 8px">Clear slip</button>
    ${picks.map(p => card(p)).join('')}`;
  wire($('p-slip'));
  $('clearslip').addEventListener('click', () => { FAVS.clear(); renderAll(); });
}

function equityChart(eq){
  if(!eq || eq.length < 3) return '';
  const W = 320, H = 90, P = 4;
  const ys = eq.map(d => d.units);
  const x1 = eq.length, y0 = Math.min(0, ...ys), y1 = Math.max(0, ...ys);
  const px = i => P + i / Math.max(x1 - 1, 1) * (W - 2*P);
  const py = v => H - P - (v - y0) / Math.max(y1 - y0, 1) * (H - 2*P);
  const pts = eq.map((d,i) => `${px(i).toFixed(1)},${py(d.units).toFixed(1)}`).join(' ');
  const last = ys[ys.length-1];
  return `<div class="chart">
    <div class="chart-t">Units over time · ${last > 0 ? '+' : ''}${last.toFixed(1)}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:90px">
      <line x1="0" y1="${py(0)}" x2="${W}" y2="${py(0)}" stroke="var(--rule)"/>
      <polyline points="${pts}" fill="none" stroke="${last >= 0 ? 'var(--win)' : 'var(--loss)'}"
        stroke-width="2" stroke-linejoin="round"/>
    </svg></div>`;
}

function confChart(tiers, be){
  if(!tiers || tiers.length < 2) return '';
  const W = 320, H = 112, P = 16, n = tiers.length;
  const gap = (W - 2*P) / n, bw = gap * 0.6, lo = 35, hi = 68;
  const py = v => H - P - (v - lo) / (hi - lo) * (H - 2*P);
  const bars = tiers.map((t,i) => {
    if(t.win_pct == null) return '';
    const x = P + i*gap + (gap - bw)/2, y = py(t.win_pct), base = py(lo);
    const beats = t.se != null && (t.win_pct - t.se) > (be ?? 52.4);
    const eb = t.se != null
      ? `<line x1="${x+bw/2}" y1="${py(t.win_pct - t.se)}" x2="${x+bw/2}"
           y2="${py(t.win_pct + t.se)}" stroke="var(--paper)" stroke-width="1" opacity=".6"/>` : '';
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(base-y,1)}"
        fill="${beats ? 'var(--win)' : 'var(--cool)'}" opacity=".85"/>${eb}
      <text x="${x+bw/2}" y="${H-4}" text-anchor="middle" font-size="7.5"
        fill="#8b9aad" font-family="monospace">${esc(String(t.label).replace('%',''))}</text>`;
  }).join('');
  const beY = py(be ?? 52.4);
  return `<div class="chart">
    <div class="chart-t">Win rate by how sure the model was</div>
    <svg viewBox="0 0 ${W} ${H}" style="height:112px">
      <line x1="${P}" y1="${beY}" x2="${W-P}" y2="${beY}" stroke="var(--brass)"
        stroke-dasharray="3 3"/>
      <text x="${W-P}" y="${beY-3}" text-anchor="end" font-size="7.5" fill="#c8973f"
        font-family="monospace">break even</text>
      ${bars}
    </svg></div>`;
}

function renderRecord(){
  const d = DATA, r = d.record || {}, bm = d.record_by_market || {};
  let h = '';
  if(r.settled){
    h += `<div class="tiles">
      <div class="tile"><div class="tile-k">Record</div>
        <div class="tile-v">${r.wins}-${r.losses}${r.pushes ? '-' + r.pushes : ''}</div>
        <div class="tile-sub">${r.win_pct ?? '--'}% · need ${r.breakeven_pct ?? 52.4}%</div></div>
      <div class="tile"><div class="tile-k">Units</div>
        <div class="tile-v ${r.units > 0 ? 'pos' : r.units < 0 ? 'neg' : ''}">${r.units > 0 ? '+' : ''}${esc(r.units)}</div>
        <div class="tile-sub">${r.roi_pct ?? '--'}% return</div></div>
      <div class="tile"><div class="tile-k">Line value</div>
        <div class="tile-v ${r.avg_clv > 0 ? 'pos' : r.avg_clv < 0 ? 'neg' : ''}">${r.avg_clv == null ? '--' : (r.avg_clv > 0 ? '+' : '') + r.avg_clv}</div>
        <div class="tile-sub">vs closing line</div></div>
    </div>` + equityChart(d.equity);
    const mrow = (lab,m) => m ? `<div class="tile"><div class="tile-k">${lab}</div>
      <div class="tile-v">${m.wins}-${m.losses}</div>
      <div class="tile-sub">${m.win_pct ?? '--'}% · ${m.units > 0 ? '+' : ''}${m.units}u</div></div>` : '';
    if(bm.spread || bm.total || bm.top){
      h += `<h2>By type</h2><div class="tiles">
        ${mrow('Sides',bm.spread)}${mrow('Totals',bm.total)}${mrow('Top picks',bm.top)}</div>`;
    }
  } else {
    h += `<div class="empty"><div class="empty-h">No results yet</div>
      <div class="empty-p">Picks are logged and graded automatically once games finish.</div></div>`;
  }

  const ct = d.confidence_tiers || [];
  if(ct.length){
    h += `<h2>Does "sure" mean anything?</h2>
      <p class="sub">Past picks grouped by how sure the model was.</p>` + confChart(ct, r.breakeven_pct);
    const top = ct[ct.length-1], bot = ct[0];
    if(top.win_pct != null && bot.win_pct != null){
      const gapv = (top.win_pct - bot.win_pct).toFixed(1);
      const good = gapv > 3 && top.se != null && (top.win_pct - top.se) > (r.breakeven_pct ?? 52.4);
      h += `<div class="note">${good
        ? `Most sure beat least sure by ${gapv} pts and cleared break-even. Encouraging.`
        : `Most sure vs least sure: ${gapv} pts. Not enough to matter — read the ranking as opinion, not proof.`}</div>`;
    }
  }

  const bt = d.backtest || {}, ts = d.totals || {};
  h += `<h2>Model vs book</h2>
    <p class="sub">Average miss on the final score. Lower is better.</p>
    <div class="tiles">
      <div class="tile"><div class="tile-k">Sides</div>
        <div class="tile-v">${bt.overall ? esc(bt.overall.model_mae) : '--'}</div>
        <div class="tile-sub">book ${bt.overall ? esc(bt.overall.market_mae) : '--'}</div></div>
      <div class="tile"><div class="tile-k">Totals</div>
        <div class="tile-v">${ts.model_mae != null ? esc(ts.model_mae) : '--'}</div>
        <div class="tile-sub">book ${ts.market_mae != null ? esc(ts.market_mae) : '--'}</div></div>
      <div class="tile"><div class="tile-k">Past picks</div>
        <div class="tile-v">${bt.qualified_win_pct != null ? esc(bt.qualified_win_pct)+'%' : '--'}</div>
        <div class="tile-sub">${bt.qualified_bets ?? '--'} graded</div></div>
    </div>`;

  const hist = d.history || [];
  if(hist.length){
    h += `<h2>Every graded pick</h2>` + hist.map(x => `
      <div class="rrow">
        <div class="badge ${esc(x.result)}">${x.result === 'push' ? 'P' : x.result === 'win' ? 'W' : 'L'}</div>
        <div class="rmain"><div class="rpick">${esc(x.pick)} ${x.pick_spread == null ? '' : sgn(x.pick_spread)}</div>
          <div class="rsub">${esc(x.away)} at ${esc(x.home)}${x.margin == null ? '' : ' · ' + sgnInt(x.margin)}</div></div>
        <div class="rsub">${x.clv == null ? '' : sgn(x.clv)}</div>
      </div>`).join('');
  }
  $('p-record').innerHTML = h;
}

function renderModel(){
  const d = DATA, st = d.state || {}, pm = d.prior_model || {}, bt = d.backtest || {};
  const excl = (d.situational || {})._excluded || {};
  const co = pm.coefficients || {};
  const be = (d.record || {}).breakeven_pct ?? 52.4;
  const ratings = (d.ratings || []).slice(0,25).map(r => `
    <div class="rrow"><div class="rsub" style="width:22px;text-align:right">${r.rank}</div>
      <div class="rmain"><div class="rpick">${esc(r.team)}</div></div>
      <div class="rsub">${sgn(r.rating)}</div></div>`).join('');

  $('p-model').innerHTML = `
  <h2>What this is</h2>
  <p class="sub">A power-rating model for college football. It prices every game,
  compares its number to the book's, and tracks every pick it flags.</p>

  <h3>Reading a card</h3>
  <dl>
    <dt>Gap</dt><dd>How far the model is from the book, in points.</dd>
    <dt>Sure</dt><dd>The gap divided by how wrong the model usually is on that kind of
      game. <b>A small gap on a well-understood game beats a big gap on a mystery.</b>
      Top picks are ranked by this, not by gap size.</dd>
    <dt>Qualified vs Top</dt><dd>Qualified clears the threshold
      (${esc(d.min_edge ?? 3)} pts sides, ${esc((d.totals||{}).min_edge ?? 4)} totals).
      Top means it's among the ${esc(d.top_pick_count ?? 5)} most sure of those.</dd>
    <dt>The bar</dt><dd>Blue is the book's number, gold is the model's.</dd>
    <dt>Bullets</dt><dd>What's actually driving the number on that game. Red means caution.</dd>
  </dl>

  <h3>Reading the record</h3>
  <dl>
    <dt>Break-even is ${esc(be)}%</dt>
    <dd>At ${esc(d.assumed_price ?? -110)} pricing you must win that often to stay level.
      Below it loses money.</dd>
    <dt>Line value</dt><dd>Whether the number moved toward the pick after it was logged.
      <b>This matters sooner than win rate</b> — it shows up in dozens of picks, where
      win rate needs hundreds.</dd>
    <dt>Average miss</dt><dd>How far off the final score, on average. The book is usually
      better; that gap is mostly injury news the model can't see.</dd>
    <dt>Error bars</dt><dd>The thin lines on the chart. If two bars overlap, the
      difference between them is noise.</dd>
  </dl>

  <h3>How it works</h3>
  <dl>
    <dt>Ratings</dt><dd>Every team gets a points-above-average number, fit from scoring
      margin and EPA per play across all games at once — so beating a good team counts
      more than beating a bad one.</dd>
    <dt>Turnover luck</dt><dd>Fumble recoveries are near coin flips.
      ${st.turnover_points != null
        ? `Each net turnover was worth ${esc(st.turnover_points)} pts historically;
           ${Math.round((st.turnover_shrink ?? .7)*100)}% is stripped out before rating teams.`
        : 'Not active this run.'}</dd>
    <dt>Preseason</dt><dd>Before teams play, ratings come from last year, returning
      production, recruiting, and prior-year SP+. Fit on ${esc(pm.team_seasons ?? '--')}
      team-seasons, R² ${esc(pm.r2 ?? '--')}.
      ${st.in_season_weight != null ? `Now ${Math.round(st.in_season_weight*100)}% this season.` : ''}</dd>
    <dt>Totals</dt><dd>A separate model rating offense and defense apart, plus wind, cold
      and rain. ${st.uses_weather
        ? `${esc(st.weather_games ?? 0)} games have weather, ${esc(st.domes ?? 0)} venues indoors.`
        : 'Weather still loading — totals are weaker without it.'}</dd>
    <dt>Home field</dt><dd>Worth ${esc(st.home_field ?? '--')} pts, measured not assumed.</dd>
  </dl>

  <h3>What got thrown out</h3>
  <p class="sub">Effects the data wouldn't support. Dropping them beats trusting a number
  that claims jet lag helps.</p>
  <dl>${Object.keys(excl).length
    ? Object.entries(excl).map(([k,why]) =>
        `<dt>${esc(k.replace(/_/g,' '))}</dt><dd>${esc(why)}</dd>`).join('')
    : '<dd>Nothing dropped this run.</dd>'}</dl>

  <h3>Honest limits</h3>
  <dl>
    <dt>No injury data</dt><dd>The biggest gap. A starting QB is worth several points and
      the model never knows.</dd>
    <dt>No transfer portal</dt><dd>Incoming transfers aren't counted, so rebuilt rosters
      are misrated — worst in September.</dd>
    <dt>Consensus lines</dt><dd>Numbers come from a consensus feed, not your book.
      Half a point matters.</dd>
    <dt>Past ≠ future</dt><dd>${bt.qualified_win_pct != null
      ? `Qualified picks hit ${esc(bt.qualified_win_pct)}% historically against a
         ${esc(be)}% break-even.` : 'Backtest pending.'}
      Held-out season: ${bt.holdout && bt.holdout.win_pct != null ? esc(bt.holdout.win_pct)+'%' : '--'}.</dd>
  </dl>

  <h3>Top 25</h3>
  <p class="sub">Points better than average, neutral field.</p>
  ${ratings || '<div class="empty"><div class="empty-p">Not available.</div></div>'}

  <h3>Preseason weights</h3>
  <p class="sub" style="font-family:var(--mono);font-size:11px">
    ${Object.entries(co).map(([k,v]) => `${esc(k)} ${v>0?'+':''}${esc(v)}`).join(' · ') || '--'}</p>
  <p class="sub">Data: College Football Data API, Open-Meteo.</p>`;
}

function renderTop(){
  const d = DATA, t = new Date(d.generated_at);
  $('stamp').textContent = `Updated ${t.toLocaleDateString([], {month:'short', day:'numeric'})} `
    + t.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  const live = allPicks(), r = d.record || {};
  $('summary').innerHTML = `
    <div class="sum"><div class="sum-v brass">${live.filter(p=>p.qualified).length}</div>
      <div class="sum-k">Qualified</div></div>
    <div class="sum"><div class="sum-v">${live.filter(p=>p.top_pick).length}</div>
      <div class="sum-k">Top picks</div></div>
    <div class="sum"><div class="sum-v ${r.units>0?'pos':r.units<0?'neg':''}">${r.settled ? (r.units>0?'+':'')+r.units : '--'}</div>
      <div class="sum-k">Units</div></div>`;
  const badge = (id,n,label) => { $(id).innerHTML = n ? `${label}<span class="badge-n">${n}</span>` : label; };
  badge('t-board', live.length, 'Board');
  badge('t-slip', FAVS.size, 'Slip');
}

function wire(root){
  root.querySelectorAll('[data-fav]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.fav;
    FAVS.has(id) ? FAVS.delete(id) : FAVS.add(id);
    renderAll();
  }));
  root.querySelectorAll('.chip[data-f]').forEach(c => c.addEventListener('click', () => {
    FILTERS[c.dataset.f] = c.dataset.v;
    renderBoard(); renderTop();
  }));
  const sel = root.querySelector('#sortsel');
  if(sel) sel.addEventListener('change', e => { SORT = e.target.value; renderBoard(); });
}

function renderAll(){ renderTop(); renderBoard(); renderSlip(); renderRecord(); renderModel(); }

const TABS = [['t-board','p-board'],['t-slip','p-slip'],['t-record','p-record'],['t-model','p-model']];
TABS.forEach(([tid,pid]) => $(tid).addEventListener('click', () => {
  TABS.forEach(([t,p]) => { $(t).setAttribute('aria-selected', t===tid); $(p).hidden = t!==tid; });
  window.scrollTo({top:0, behavior:'instant'});
}));

fetch('data.json?t=' + Date.now())
  .then(r => { if(!r.ok) throw new Error('data.json ' + r.status); return r.json(); })
  .then(d => { DATA = d; renderAll(); })
  .catch(e => {
    $('p-board').innerHTML = `<div class="empty"><div class="empty-h">No data yet</div>
      <div class="empty-p">Run the update workflow in GitHub.<br>
      <span style="font-family:var(--mono);font-size:11px">${esc(e.message)}</span></div></div>`;
  });
</script>
</body>
</html>
