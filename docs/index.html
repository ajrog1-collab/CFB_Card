<style>
  /* Bebas Neue served from this repo, not Google. Networks that block Google
     Fonts were silently falling back to a rounded system face, which is why the
     wordmark looked wrong. Subset to the characters used: 57KB -> 14KB.
     SIL Open Font Licence, text in BebasNeue-OFL.txt. */
  @font-face{
    font-family:'Bebas Neue Local';
    src:url('BebasNeue-Regular.ttf') format('truetype');
    font-weight:400;font-style:normal;font-display:swap;
  }
</style>
<style>
  /* Palette: Navy 2965C, Cream 7527C, Gold 7555C, Blue 7690C */
  :root{
    --navy:#002B45; --navy-deep:#0C1B29; --cream:#D7D2CB; --cream-lt:#EFECE6;
    --gold:#B4892C; --blue:#10739E;
    --display:'Bebas Neue Local','Bebas Neue',Impact,'Arial Narrow',sans-serif;
    --data:'Barlow',ui-monospace,monospace;      /* DIN 2014 substitute */
    --body:'Inter',system-ui,sans-serif;
  }
  /* PRO overrides. Sampled from the NFL Shield lockups: navy #153D78, red
     #B1131A on cream; the dark card sits on #0B2541. Red replaces gold as the
     accent so the pro side reads differently at a glance. */
  [data-sport="nfl"]{
    --navy:#153D78; --navy-deep:#0B2541; --gold:#B1131A; --blue:#153D78;
  }
  [data-sport="nfl"][data-theme="dark"]{
    --page:#0B2541; --panel:#12355C; --panel-2:#1A4272; --rule:#28527F;
    --ink:#F6F0DD; --mute:#93AAC7;
  }
  [data-sport="nfl"][data-theme="light"]{
    --page:#F6F0DD; --ticket:#0B2541; --ticket-ink:#F6F0DD; --ticket-rule:#28527F;
    --ticket-mute:#93AAC7; --panel:#E6DFC9; --panel-2:#DAD2B9; --rule:#C3BBA2;
    --ink:#153D78; --mute:#5A6B84;
  }

  /* dark: navy page, cream tickets */
  [data-theme="dark"]{
    --page:#0C1B29; --ticket:#EFECE6; --ticket-ink:#002B45; --ticket-rule:#C3BDB2;
    --ticket-mute:#6B7683; --panel:#12283B; --panel-2:#183246; --rule:#24455E;
    --ink:#EFECE6; --mute:#8FA3B4;
  }
  /* light: cream page, navy tickets */
  [data-theme="light"]{
    --page:#EFECE6; --ticket:#0C1B29; --ticket-ink:#EFECE6; --ticket-rule:#24455E;
    --ticket-mute:#8FA3B4; --panel:#E2DED6; --panel-2:#D7D2CB; --rule:#C3BDB2;
    --ink:#002B45; --mute:#5D6B78;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;
    line-height:1.5;-webkit-font-smoothing:antialiased;
    /* Added to the home screen, iOS draws the page under the status bar and
       Dynamic Island. These insets push content clear of them; they resolve to
       0 in a normal browser tab. */
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
    transition:background .2s,color .2s}
  /* iOS draws the clock and battery in white over a translucent bar, which
     would vanish against the cream light theme. A fixed navy strip behind the
     status bar keeps them legible in both themes. Zero height in a browser. */
  body::before{content:'';position:fixed;top:0;left:0;right:0;z-index:200;
    height:env(safe-area-inset-top, 0px);background:#0C1B29}
  [data-sport="nfl"] body::before,body[data-sport="nfl"]::before{background:#0B2541}

  .wrap{max-width:720px;margin:0 auto;
    padding:0 calc(12px + env(safe-area-inset-right, 0px)) 60px
             calc(12px + env(safe-area-inset-left, 0px))}
  .num{font-family:var(--data);font-variant-numeric:tabular-nums;font-weight:600}

  /* ---------- masthead ---------- */
  .top{display:flex;align-items:center;gap:10px;padding:14px 0 8px}
  /* Supplied lockup artwork: it already contains the card, divider, tick rule
     and folded corner, so nothing is drawn around it. */
  .brand{flex:0 1 auto;min-width:0;display:flex;align-items:center}
  /* max-height rather than height, so on a narrow screen the lockup scales
     down proportionally instead of pushing the buttons off the row. */
  .brand-img{display:block;height:auto;width:auto;max-height:78px;max-width:100%}
  @media (max-width:520px){ .brand-img{max-height:60px} }
  @media (max-width:380px){ .brand-img{max-height:52px} }

  /* Buttons and the timestamp share a right-hand column so the timestamp sits
     under them instead of stretching the full width below the logo. */
  .topright{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;
    gap:6px;flex:none}
  .topbtns{display:flex;gap:6px;align-items:center}
  .iconbtn{appearance:none;border:1px solid var(--rule);background:transparent;color:var(--mute);
    width:34px;height:34px;border-radius:5px;cursor:pointer;font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center}
  .iconbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .stamp{font-family:var(--data);font-size:9.5px;color:var(--mute);letter-spacing:.08em;
    font-weight:500;text-align:right;white-space:nowrap}

  /* ---------- tabs ---------- */
  .sportbar{display:flex;gap:3px;margin-top:2px;background:var(--panel);border-radius:5px;
    padding:3px}
  .sport{flex:1;appearance:none;border:0;cursor:pointer;background:transparent;
    color:var(--mute);font-family:var(--display);font-size:14px;letter-spacing:.14em;
    padding:7px 4px;border-radius:3px;transition:background .15s,color .15s}
  .sport[aria-selected="true"]{background:var(--ticket);color:var(--ticket-ink)}
  .sport:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  .brand-fallback{background:var(--ticket);color:var(--ticket-ink);border-radius:7px;
    padding:8px 22px 8px 12px;position:relative;overflow:hidden}
  .brand-fallback[hidden]{display:none}
  .bf-the{font-family:var(--display);font-size:11px;letter-spacing:.26em;line-height:1;
    display:flex;align-items:center;gap:5px}
  .bf-the::before,.bf-the::after{content:'';width:11px;height:2px;
    background:var(--ticket-ink);flex:none}
  .bf-name{font-family:var(--display);font-size:31px;line-height:.86;letter-spacing:.02em}
  .bf-sub{font-family:var(--data);font-size:8px;letter-spacing:.2em;color:var(--gold);
    font-weight:700;margin-top:2px}
  .brand-fallback::after{content:'';position:absolute;right:0;bottom:0;width:0;height:0;
    border-left:16px solid transparent;border-bottom:16px solid var(--gold)}

  nav{display:flex;gap:3px;position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;
    background:var(--page);padding:8px 0;border-bottom:1px solid var(--rule)}
  .tab{flex:1 1 0;min-width:0;appearance:none;border:1px solid transparent;cursor:pointer;
    background:var(--panel);color:var(--mute);font-family:var(--display);font-size:15px;
    letter-spacing:.06em;padding:9px 3px;border-radius:4px;white-space:nowrap;
    transition:background .15s,color .15s}
  .tab[aria-selected="true"]{background:var(--gold);color:#0C1B29}
  .tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .tab .n{font-family:var(--data);font-size:10px;margin-left:4px;opacity:.8;font-weight:600}
  .panel[hidden]{display:none}

  /* ---------- drawer ---------- */
  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;
    justify-content:flex-end}
  .drawer[hidden]{display:none}
  .drawer-in{background:var(--page);width:min(320px,86vw);height:100%;
    padding:calc(16px + env(safe-area-inset-top, 0px)) 14px
            calc(16px + env(safe-area-inset-bottom, 0px));
    overflow:auto;border-left:1px solid var(--rule)}
  .drawer-h{display:flex;align-items:center;margin-bottom:10px}
  .drawer-h .t{font-family:var(--display);font-size:22px;letter-spacing:.06em}
  .drawer-h button{margin-left:auto}
  .menu-item{display:block;width:100%;text-align:left;appearance:none;border:0;
    background:var(--panel);color:var(--ink);font-family:var(--display);font-size:17px;
    letter-spacing:.07em;padding:11px 12px;border-radius:4px;margin-bottom:6px;cursor:pointer}
  .menu-item[aria-selected="true"]{background:var(--gold);color:#0C1B29}

  /* ---------- filters ---------- */
  .filters{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 4px;align-items:stretch}
  /* Chips grow to share the row rather than clustering at the left, so the
     control bar reads as one deliberate block instead of five small buttons. */
  .chip{appearance:none;border:1px solid var(--rule);background:transparent;color:var(--mute);
    font-family:var(--data);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    font-weight:600;padding:9px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;
    flex:1 1 auto;text-align:center;line-height:1}
  .chipgap{display:none}
  @media (max-width:420px){
    .chip{font-size:10px;letter-spacing:.04em;padding:9px 4px}
    .filters{gap:4px}
  }
  .chip[aria-pressed="true"]{background:var(--gold);color:#0C1B29;border-color:var(--gold)}
  .chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .sortbar{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-family:var(--data);
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);
    font-weight:600;flex-wrap:wrap}
  .sortbar select{max-width:46vw}
  .chipgap{width:7px;flex:none}
  .sortbar select{background:var(--panel);color:var(--ink);border:1px solid var(--rule);
    border-radius:3px;font-family:var(--data);font-size:11px;padding:5px 7px;font-weight:600}
  .count{margin-left:auto}
  .searchwrap{position:relative;margin:10px 0 2px}
  .search{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--rule);
    border-radius:4px;font-family:var(--body);font-size:14px;padding:9px 32px 9px 11px}
  .search::placeholder{color:var(--mute)}
  .search:focus{outline:2px solid var(--blue);outline-offset:1px}
  .searchclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);
    appearance:none;border:0;background:transparent;color:var(--mute);font-size:15px;
    cursor:pointer;padding:4px 6px}
  .sugg{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:40;background:var(--panel);
    border:1px solid var(--rule);border-radius:4px;max-height:210px;overflow:auto}
  .sugg[hidden]{display:none}
  .sugg button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    appearance:none;border:0;background:transparent;color:var(--ink);font-family:var(--body);
    font-size:14px;padding:8px 11px;cursor:pointer}
  .sugg button:hover,.sugg button.on{background:var(--panel-2)}
  .sugg img{width:18px;height:18px;object-fit:contain;flex:none}

  .sharebtn{appearance:none;border:0;cursor:pointer;background:var(--gold);color:#0C1B29;
    font-family:var(--display);font-size:15px;letter-spacing:.1em;padding:0 13px;height:34px;
    border-radius:5px;display:flex;align-items:center;gap:6px;position:relative;overflow:hidden}
  .sharebtn::after{content:'';position:absolute;right:0;bottom:0;width:0;height:0;
    border-left:9px solid transparent;border-bottom:9px solid rgba(0,0,0,.28)}

  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:70;overflow:auto;
    padding:calc(14px + env(safe-area-inset-top, 0px)) 14px
            calc(14px + env(safe-area-inset-bottom, 0px));
    display:flex;justify-content:center;align-items:flex-start}
  .sheet[hidden]{display:none}
  .sc{width:100%;max-width:390px;background:var(--ticket);color:var(--ticket-ink);
    border-radius:10px;position:relative;overflow:hidden;padding:12px 13px 10px}
  .sc .fold{border-left:24px solid transparent;border-bottom:24px solid var(--gold)}
  .sc-head{display:flex;align-items:flex-end;gap:9px;padding-bottom:8px;
    border-bottom:1px solid var(--ticket-rule)}
  .sc-the{font-family:var(--display);font-size:10px;letter-spacing:.26em;line-height:1;
    display:flex;align-items:center;gap:4px}
  .sc-the::before,.sc-the::after{content:'';width:9px;height:2px;background:var(--ticket-ink)}
  .sc-card{font-family:var(--display);font-size:29px;line-height:.82;white-space:nowrap}
  .sc-meta{margin-left:auto;text-align:right;font-family:var(--data);font-size:8.5px;
    letter-spacing:.13em;font-weight:700;color:var(--ticket-mute);line-height:1.5}
  .sc-row{display:grid;grid-template-columns:15px 1fr auto;gap:7px;align-items:center;
    padding:5px 0;border-bottom:1px solid var(--ticket-rule)}
  .sc-row:last-of-type{border-bottom:0}
  .sc-n{font-family:var(--data);font-size:10px;font-weight:700;color:var(--ticket-mute);
    text-align:right}
  .sc-g{min-width:0}
  .sc-m{font-family:var(--data);font-size:9px;letter-spacing:.06em;color:var(--ticket-mute);
    font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sc-p{font-family:var(--display);font-size:16px;line-height:1;letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sc-r{text-align:right;white-space:nowrap}
  .sc-line{font-family:var(--data);font-size:14px;font-weight:700}
  .sc-st{font-size:8px;letter-spacing:.5px;color:var(--gold);line-height:1}
  .sc-st .off{color:var(--ticket-rule)}
  .sc-foot{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:7px;
    border-top:1px solid var(--ticket-rule)}
  .sc-tag{font-family:var(--data);font-size:8.5px;letter-spacing:.2em;color:var(--gold);
    font-weight:700}
  .sc-note{margin-left:auto;font-family:var(--data);font-size:8px;color:var(--ticket-mute);
    font-weight:600;letter-spacing:.08em}
  .sheet-actions{display:flex;gap:7px;justify-content:center;margin-top:10px;width:100%;
    max-width:390px}

  .stale{display:flex;align-items:flex-start;gap:9px;border-radius:4px;padding:10px 12px;
    margin:10px 0 0;font-size:13px;line-height:1.4}
  .stale.warn{background:rgba(180,137,44,.14);border-left:3px solid var(--gold)}
  .stale.bad{background:rgba(180,87,79,.16);border-left:3px solid #B4574F}
  .stale-i{font-family:var(--display);font-size:17px;line-height:1;flex:none;margin-top:1px}
  .stale.warn .stale-i{color:var(--gold)} .stale.bad .stale-i{color:#B4574F}
  .stale b{font-weight:600}
  .stale small{display:block;color:var(--mute);font-family:var(--data);font-size:10px;
    margin-top:3px;letter-spacing:.06em}

  .balance{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--data);font-size:9.5px;
    letter-spacing:.1em;font-weight:600;color:var(--mute);margin:6px 0 2px}
  .balance b{color:var(--ink);font-weight:700}
  .balance .warn{color:var(--gold)}

  /* ---------- ticket ---------- */
  .ticket{background:var(--ticket);color:var(--ticket-ink);border-radius:8px;
    margin:9px 0;position:relative;overflow:hidden;display:flex}
  .ticket .fold{border-left:20px solid transparent;border-bottom:20px solid var(--gold)}
  .t-main{flex:1;min-width:0;padding:9px 11px 8px}
  .t-side{width:96px;flex:none;border-left:1px solid var(--ticket-rule);
    padding:9px 10px 8px;display:flex;flex-direction:column;gap:5px}
  .t-head{display:flex;align-items:baseline;gap:8px;font-family:var(--data);font-size:9px;
    letter-spacing:.14em;font-weight:600;color:var(--ticket-mute)}
  .t-head .when{margin-left:auto;white-space:nowrap}
  .t-teams{margin-top:7px}
  .t-team{display:flex;align-items:center;gap:9px;line-height:1}
  .t-team + .t-team{margin-top:5px}
  .t-logo{width:30px;height:30px;flex:none;object-fit:contain}
  .t-logo-fb{width:30px;height:30px;flex:none;border-radius:4px;display:flex;
    align-items:center;justify-content:center;font-family:var(--display);font-size:13px;
    color:#fff;letter-spacing:.02em}
  .t-name{font-family:var(--display);font-size:27px;letter-spacing:.015em;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:.95}
  .t-at{font-family:var(--data);font-size:8.5px;letter-spacing:.2em;color:var(--ticket-mute);
    font-weight:700;margin:4px 0 4px 39px;position:relative}
  .t-at::after{content:'';position:absolute;left:26px;right:0;top:50%;height:1px;
    background:var(--ticket-rule);opacity:.5}
  .t-rule{display:flex;align-items:flex-end;gap:2px;height:9px;margin:7px 0 6px;opacity:.75}
  .t-rule i{width:1px;height:4px;background:var(--ticket-rule);display:block}
  .t-rule i.tall{height:9px;background:var(--gold)}
  .t-pick{display:flex;align-items:center;gap:7px;background:var(--gold);
    color:#0C1B29;border-radius:3px;padding:5px 8px}
  .t-pick-k{font-family:var(--data);font-size:8.5px;letter-spacing:.18em;font-weight:700;
    opacity:.75}
  .t-pick-v{font-family:var(--display);font-size:17px;letter-spacing:.03em;line-height:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-pick-n{margin-left:auto;font-family:var(--data);font-size:15px;font-weight:700;
    font-variant-numeric:tabular-nums}
  .t-foot{display:flex;align-items:center;gap:7px;margin-top:7px}
  .t-mark{font-family:var(--display);font-size:11px;letter-spacing:.06em;line-height:.9;
    color:var(--ticket-mute)}
  .t-mark b{display:block;font-size:13px;color:var(--ticket-ink);font-weight:400}
  .why{margin-left:auto;appearance:none;border:1px solid var(--ticket-rule);background:transparent;
    color:var(--ticket-mute);font-family:var(--data);font-size:9px;letter-spacing:.14em;
    font-weight:700;padding:3px 7px;border-radius:3px;cursor:pointer}
  .why[aria-expanded="true"]{background:var(--ticket-rule);color:var(--ticket-ink)}
  .star{appearance:none;border:0;background:transparent;cursor:pointer;font-size:16px;
    line-height:1;color:var(--ticket-rule);padding:0}
  .star[aria-pressed="true"]{color:var(--gold)}

  .d-row{display:flex;align-items:baseline;gap:4px}
  .d-k{font-family:var(--data);font-size:8px;letter-spacing:.15em;font-weight:700;
    color:var(--ticket-mute)}
  .d-v{margin-left:auto;font-family:var(--data);font-size:14px;font-weight:700;
    font-variant-numeric:tabular-nums}
  .d-v.model{color:var(--blue)}
  .d-v.edge{color:var(--gold)}
  .stars{font-size:11px;letter-spacing:1px;color:var(--gold);line-height:1;margin-top:1px}
  .stars .off{color:var(--ticket-rule)}

  .drivers{padding:0 11px 9px;border-top:1px solid var(--ticket-rule);margin:0 11px 8px 11px;
    padding-left:0;padding-right:0}
  .drivers[hidden]{display:none}
  .driver{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.35;
    margin-top:6px;color:var(--ticket-ink)}
  .dot{width:5px;height:5px;border-radius:50%;flex:none;margin-top:5px;background:var(--blue)}
  .dot.caution{background:#B4574F}
  .dot.weather,.dot.travel,.dot.rest{background:var(--gold)}
  .driver.caution{color:var(--ticket-mute)}

  /* ---------- panels, tiles, charts ---------- */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
  .tile{background:var(--panel);border-radius:4px;padding:10px}
  .tile-k{font-family:var(--data);font-size:8.5px;letter-spacing:.14em;font-weight:700;
    color:var(--mute)}
  .tile-v{font-family:var(--display);font-size:26px;line-height:1.05;margin-top:3px}
  .tile-v.pos{color:#4E9A6B} .tile-v.neg{color:#B4574F}
  .tile-sub{font-family:var(--data);font-size:10px;color:var(--mute);margin-top:1px;font-weight:500}
  .chart{background:var(--panel);border-radius:4px;padding:12px 12px 8px;margin:10px 0}
  .chart-t{font-family:var(--data);font-size:9px;letter-spacing:.15em;font-weight:700;
    color:var(--mute);margin-bottom:9px}
  svg{display:block;width:100%}
  .legend{display:flex;gap:13px;margin-top:8px;font-family:var(--data);font-size:9.5px;
    font-weight:600}
  .legend span{display:flex;align-items:center;gap:5px;color:var(--mute)}
  .legend i{width:12px;height:2px;display:inline-block}

  .srow{display:grid;grid-template-columns:48px 1fr 60px 54px;gap:9px;align-items:center;
    padding:9px 0;border-bottom:1px solid var(--rule)}
  .syear{font-family:var(--display);font-size:18px}
  .syear .live{font-family:var(--data);font-size:8px;color:var(--gold);display:block;
    letter-spacing:.12em;font-weight:700}
  .sbar{position:relative;height:14px}
  .sbar-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--rule)}
  .sbar-fill{position:absolute;top:3px;height:8px;border-radius:1px}
  .sright{font-family:var(--data);font-size:12.5px;text-align:right;font-weight:600}
  .sright small{display:block;font-size:9px;color:var(--mute);font-weight:500}

  .fold-h{display:flex;align-items:center;gap:8px;width:100%;appearance:none;border:0;
    background:var(--panel);color:var(--ink);border-radius:4px;padding:11px 12px;
    margin:16px 0 0;cursor:pointer;text-align:left}
  .fold-h .t{font-family:var(--display);font-size:17px;letter-spacing:.05em}
  .fold-h .s{font-family:var(--data);font-size:9.5px;color:var(--mute);font-weight:600;
    letter-spacing:.08em;margin-left:auto}
  .fold-h .cv{font-family:var(--data);font-size:12px;color:var(--gold);
    transition:transform .15s;flex:none}
  .fold-h[aria-expanded="true"] .cv{transform:rotate(90deg)}
  .fold-h:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .fold-b[hidden]{display:none}
  .fold-b{padding-top:2px}

  .rrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--rule)}
  .badge{font-family:var(--display);font-size:12px;width:28px;flex:none;text-align:center;
    padding:3px 0;border-radius:2px}
  .badge.win{background:#4E9A6B;color:#0C1B29}
  .badge.loss{background:#B4574F;color:#fff}
  .badge.push{background:var(--rule);color:var(--ink)}
  .rmain{flex:1;min-width:0}
  .rpick{font-family:var(--display);font-size:16px;letter-spacing:.02em}
  .rsub{font-family:var(--data);font-size:10px;color:var(--mute);font-weight:500}

  h2{font-family:var(--display);font-size:21px;letter-spacing:.05em;margin:20px 0 2px}
  h3{font-family:var(--display);font-size:17px;letter-spacing:.05em;margin:18px 0 4px;color:var(--gold)}
  .sub{font-size:12.5px;color:var(--mute);margin:0 0 6px}
  .empty{background:var(--panel);border-radius:4px;padding:26px 16px;text-align:center;margin:10px 0}
  .empty-h{font-family:var(--display);font-size:21px;letter-spacing:.05em}
  .empty-p{font-size:13px;color:var(--mute);margin-top:5px}
  .note{background:var(--panel);border-left:3px solid var(--blue);padding:10px 12px;
    margin:10px 0;font-size:13px;border-radius:0 4px 4px 0}
  .note.warn{border-left-color:var(--gold)}
  dl{margin:0} dt{font-family:var(--display);font-size:16px;letter-spacing:.04em;margin-top:13px}
  dd{margin:3px 0 0;font-size:13.5px;color:var(--mute);line-height:1.5}
  dd b{color:var(--ink);font-weight:600}
  .watermark{text-align:center;padding:26px 0 8px;opacity:.22}
  .watermark .c{font-family:var(--display);font-size:46px;letter-spacing:.05em;color:var(--ink)}
  .watermark .t{font-family:var(--data);font-size:9px;letter-spacing:.3em;color:var(--ink);
    font-weight:700}
  /* Phones: compress the lockup rather than dropping half of it, so the full
     logo and the buttons still share one row. */
  @media (max-width:520px){
    .brand-l{padding:6px 9px 6px 9px}
    .brand-r{padding:6px 15px 6px 8px;gap:0}
    .brand-sub,.brand-tag{font-size:7px;letter-spacing:.13em}
    .brand .fold{border-left-width:13px;border-bottom-width:13px}
    .sharebtn{font-size:13.5px;padding:0 9px;letter-spacing:.07em}
    .topright{gap:5px}
    .iconbtn{width:31px;height:31px}
  }
  /* Very narrow: the strapline goes, the wordmark stays. */
  @media (max-width:340px){
    .brand-rule,.brand-r{display:none}
  }
  @media (max-width:430px){
    .t-side{width:84px}
    .t-name{font-size:22px}
    .t-logo,.t-logo-fb{width:26px;height:26px}
    .tab{font-size:13.5px;letter-spacing:.05em}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <img class="brand-img" id="brandimg" src="logo-lockup.png"
           alt="The Card" width="900" height="284">
      <!-- Used only if the pro lockup art is missing, so the site still reads
           correctly before that file exists. -->
      <div class="brand-fallback" id="brandfallback" hidden>
        <div class="bf-the">THE</div><div class="bf-name">PRO CARD</div>
        <div class="bf-sub">NFL ANALYTICS</div>
      </div>
    </div>
    <div class="topright">
      <div class="topbtns">
        <button class="sharebtn" id="sharebtn">THE CARD</button>
        <button class="iconbtn" id="themebtn" aria-label="Switch theme">◐</button>
        <button class="iconbtn" id="menubtn" aria-label="Open menu">☰</button>
      </div>
      <div class="stamp" id="stamp"></div>
    </div>
  </div>

  <div class="sportbar" role="tablist" aria-label="Sport">
    <button class="sport" id="s-cfb" role="tab" aria-selected="true">COLLEGE</button>
    <button class="sport" id="s-nfl" role="tab" aria-selected="false">PRO</button>
  </div>

  <div id="staleban"></div>

  <nav role="tablist">
    <button class="tab" role="tab" id="t-board" aria-controls="p-board" aria-selected="true">GAMES</button>
    <button class="tab" role="tab" id="t-slip" aria-controls="p-slip" aria-selected="false">YOUR CARD</button>
    <button class="tab" role="tab" id="t-record" aria-controls="p-record" aria-selected="false">RECORD</button>
  </nav>

  <section class="panel" id="p-board" role="tabpanel" aria-labelledby="t-board"></section>
  <section class="panel" id="p-slip" role="tabpanel" aria-labelledby="t-slip" hidden></section>
  <section class="panel" id="p-record" role="tabpanel" aria-labelledby="t-record" hidden></section>
  <section class="panel" id="p-model" role="tabpanel" hidden></section>

  <div class="watermark"><div class="c">C</div><div class="t">READ THE CARD</div></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div style="width:100%;max-width:390px">
    <div class="sc" id="sharecard"></div>
    <div class="sheet-actions">
      <button class="chip" id="closesheet">Close</button>
      <button class="chip" id="sharemore" aria-pressed="false">Show 5 / 10</button>
    </div>
  </div>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-in">
    <div class="drawer-h"><div class="t">MENU</div>
      <button class="iconbtn" id="closemenu" aria-label="Close menu">✕</button></div>
    <button class="menu-item" id="m-card">THE CARD · TOP 10</button>
    <button class="menu-item" id="m-model">THE MODEL</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sgn = n => (n > 0 ? '+' : '') + Number(n).toFixed(1);
const sgnInt = n => (n > 0 ? '+' : '') + Math.round(n);

let DATA = null;
const FAVS = new Set();
const FILTERS = { market:'all', quality:'all' };
let CONF = 'all';
let WEEKS = 'this';   // this | all
let SORT = 'confidence';
let TIER = 'A';
const OPEN = { history:false, allpicks:false, historyTouched:false };
let VIEW = 'board';
let SEARCH = '';
let SHARE_N = 10;
let SPORT = 'cfb';
const CACHE = {};                       // one fetch per sport per session
const SPORTS = {
  cfb: { file:'data.json',     label:'THE CARD',     logo:'logo-lockup.png',
         logoDark:'logo-lockup.png',
         alt:'The Card — college football analytics' },
  nfl: { file:'data-nfl.json', label:'THE PRO CARD', logo:'logo-lockup-pro.png',
         logoDark:'logo-lockup-pro-dark.png',
         alt:'The Pro Card — NFL analytics' },
};

/* Tier A-E reads as 5-1 stars: more stars, more sure. */
const TIER_STARS = { A:5, B:4, C:3, D:2, E:1 };
const confOf = name => ((DATA.teams || {})[name] || {}).conf || null;
/* A group is a named set of conferences or divisions — Power 4 for college,
   AFC and NFC for the pro side. Defined by whichever model wrote the payload. */
const DEFAULT_GROUPS = {
  cfb: [{ value:'p4', label:'Power 4', members:['SEC','Big Ten','ACC','Big 12'] }],
  nfl: [{ value:'afc', label:'AFC',
          members:['AFC East','AFC North','AFC South','AFC West'] },
        { value:'nfc', label:'NFC',
          members:['NFC East','NFC North','NFC South','NFC West'] }],
};
// payload wins; the defaults keep the dropdown working against a data file
// written before the model started emitting groups
const confGroups = () => (DATA && DATA.conf_groups) || DEFAULT_GROUPS[SPORT] || [];
const confLabel = () => (DATA && DATA.conf_label) || (SPORT === 'nfl' ? 'Div' : 'Conf');
const groupMembers = value => {
  const g = confGroups().find(x => x.value === value);
  return g ? g.members : null;
};
function stars(tier){
  const n = TIER_STARS[tier] || 0;
  if(!n) return '<span class="stars"><span class="off">☆☆☆☆☆</span></span>';
  return `<span class="stars">${'★'.repeat(n)}<span class="off">${'☆'.repeat(5-n)}</span></span>`;
}

function tickRow(n, mid){
  let out = '';
  for(let i = 0; i < n; i++) out += `<i class="${i === mid ? 'tall' : ''}"></i>`;
  return out;
}

function kickText(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'}).toUpperCase()
    + ' · ' + d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}
const started = p => p.kickoff && new Date(p.kickoff) < new Date();

function allPicks(){
  const s = (DATA.picks || []).map(p => ({...p, market:'spread'}));
  const t = (DATA.total_picks || []).map(p => ({...p, market:'total',
    pick_spread:p.line, model_margin:p.model_total, market_margin:p.line}));
  return s.concat(t).filter(p => !started(p));
}
function visible(){
  let list = allPicks();
  if(SEARCH){
    list = list.filter(p => teamMatches(p.home, SEARCH) || teamMatches(p.away, SEARCH));
  }
  /* Default to the week you can actually bet. Lines two weeks out are visible
     on request but are not what the record is built from. */
  const bw = DATA.board_week;
  if(WEEKS === 'this' && bw != null){
    list = list.filter(p => p.week == null || p.week === bw);
  }
  if(FILTERS.market !== 'all') list = list.filter(p => p.market === FILTERS.market);
  if(FILTERS.quality === 'qual') list = list.filter(p => p.qualified);
  if(CONF !== 'all'){
    // A game counts if either side is in the conference, so cross-conference
    // matchups still show when you filter to one league.
    const members = groupMembers(CONF);
    const inConf = t => members ? members.includes(confOf(t)) : confOf(t) === CONF;
    list = list.filter(p => inConf(p.home) || inConf(p.away));
  }
  const key = { confidence:p => -(p.confidence ?? 0),
                kickoff:p => new Date(p.kickoff || 0).getTime() }[SORT]
              || (p => -(p.confidence ?? 0));
  return list.sort((a,b) => key(a) - key(b));
}

/* Every team with a game on the board, for the search suggestions. */
function boardConfs(){
  const set = new Set();
  allPicks().forEach(p => { [p.home, p.away].forEach(t => { const c = confOf(t); if(c) set.add(c); }); });
  return [...set].sort();
}

function boardTeams(){
  const set = new Set();
  allPicks().forEach(p => { set.add(p.home); set.add(p.away); });
  return [...set].sort();
}

/* Cards show short names, so match the abbreviation and city too — "KC",
   "Kansas City" and "Chiefs" should all find the same team. */
function teamMatches(name, q){
  const t = (DATA.teams || {})[name] || {};
  const hay = [name, t.abbr, t.alias].filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

/* Team mark: real logo when available, initials on the school's colour if the
   image is missing or fails to load. */
function teamMark(name){
  const t = (DATA.teams || {})[name];
  const dark = document.documentElement.dataset.theme === 'dark';
  const col = (t && t.color) ? (t.color.startsWith('#') ? t.color : '#' + t.color) : '#6B7683';
  const ini = String(name || '?').replace(/[^A-Za-z ]/g,'').split(' ')
    .map(w => w[0]).join('').slice(0,2).toUpperCase();
  const fb = `<span class=&quot;t-logo-fb&quot; style=&quot;background:${col}&quot;>${ini}</span>`;
  const url = t && (dark ? t.logo : (t.logo_dark || t.logo));
  if(url) return `<img class="t-logo" src="${esc(url)}" alt="" loading="lazy"
    onerror="this.outerHTML='${fb}'">`;
  return `<span class="t-logo-fb" style="background:${esc(col)}">${esc(ini)}</span>`;
}

function ticket(p, rank){
  const id = p.market + ':' + p.game_id;
  const fav = FAVS.has(id);
  const isTotal = p.market === 'total';
  const book = isTotal ? p.line : p.pick_spread;
  const model = isTotal ? p.model_total : (p.edge > 0 ? -p.model_margin : p.model_margin);
  const f = v => isTotal ? Number(v).toFixed(1) : sgn(v);
  const drivers = (p.drivers || []).map(d => `
    <div class="driver ${d.kind === 'caution' ? 'caution' : ''}">
      <span class="dot ${esc(d.kind)}"></span><span>${esc(d.text)}</span></div>`).join('');
  return `
  <div class="ticket">
    <div style="flex:1;min-width:0">
      <div class="t-main">
        <div class="t-head">
          <span>${p.week != null ? 'WEEK ' + String(p.week).padStart(2,'0') : ''}</span>
          ${rank ? `<span style="color:var(--gold)">#${rank}</span>` : ''}
          <span class="when">${esc(kickText(p.kickoff))}</span>
        </div>
        <div class="t-teams">
          <div class="t-team">${teamMark(p.away)}<span class="t-name">${esc(p.away)}</span></div>
          <div class="t-at">AT</div>
          <div class="t-team">${teamMark(p.home)}<span class="t-name">${esc(p.home)}</span></div>
        </div>
        <div class="t-rule">${tickRow(29, 14)}</div>
        <div class="t-pick">
          <span class="t-pick-k">PICK</span>
          <span class="t-pick-v">${esc(p.pick)}</span>
          <span class="t-pick-n">${esc(f(book))}</span>
        </div>
        <div class="t-foot">
          <div class="t-mark">THE<b>CARD</b></div>
          ${drivers ? `<button class="why" data-info="${esc(id)}" aria-expanded="false">WHY</button>` : ''}
          <button class="star" aria-pressed="${fav}" data-fav="${esc(id)}"
            aria-label="${fav ? 'Remove from your card' : 'Add to your card'}">${fav ? '★' : '☆'}</button>
        </div>
      </div>
      ${drivers ? `<div class="drivers" id="why-${esc(id)}" hidden>${drivers}</div>` : ''}
    </div>
    <div class="t-side">
      <div><div class="d-k">MODEL</div><div class="d-row"><span class="d-v model">${esc(f(model))}</span></div></div>
      <div><div class="d-k">BOOK</div><div class="d-row"><span class="d-v">${esc(f(book))}</span></div></div>
      <div><div class="d-k">EDGE</div><div class="d-row"><span class="d-v edge">${esc(Math.abs(p.edge).toFixed(1))}</span></div></div>
      <div><div class="d-k">CONFIDENCE</div>${stars(p.tier)}</div>
    </div>
    <div class="fold"></div>
  </div>`;
}

function renderBoard(){
  const list = visible();
  /* Model caveats live in THE MODEL, not on top of the picks. */
  const chip = (g,v,l) => `<button class="chip" data-f="${g}" data-v="${v}" aria-pressed="${FILTERS[g]===v}">${l}</button>`;
  const bwLabel = DATA.board_week != null ? `Week ${DATA.board_week} only` : 'This week only';
  const controls = `
    <div class="filters">
      ${chip('quality','all','All')}${chip('quality','qual','Qualified')}
      <span class="chipgap"></span>
      ${chip('market','spread','Spreads')}${chip('market','total','Totals')}
      <span class="chipgap"></span>
      <button class="chip" data-weeks="toggle" aria-pressed="${WEEKS==='this'}"
        title="On: only the week you can bet now. Off: every game with a posted line."
        >${bwLabel}</button>
    </div>
    <div class="sortbar">
      <label for="confsel">${esc(confLabel())}</label>
      <select id="confsel">
        <option value="all"${CONF==='all'?' selected':''}>All</option>
        ${confGroups().map(g =>
          `<option value="${esc(g.value)}"${CONF===g.value?' selected':''}>${esc(g.label)}</option>`).join('')}
        ${boardConfs().map(c => `<option value="${esc(c)}"${CONF===c?' selected':''}>${esc(c)}</option>`).join('')}
      </select>
      <label for="sortsel">Sort</label>
      <select id="sortsel">
        <option value="confidence"${SORT==='confidence'?' selected':''}>Confidence</option>
        <option value="kickoff"${SORT==='kickoff'?' selected':''}>Kickoff</option>
      </select>
      <span class="count">${list.length} PICK${list.length===1?'':'S'}</span></div>`;
  let rank = 0;
  const body = list.length ? list.map(p => ticket(p, p.top_pick ? ++rank : null)).join('')
    : `<div class="empty"><div class="empty-h">NOTHING ON THE CARD</div>
       <div class="empty-p">No upcoming games match, or lines aren't posted yet.</div></div>`;
  const search = `
    <div class="searchwrap">
      <input class="search" id="teamsearch" type="text" autocomplete="off"
        placeholder="Search a team" value="${esc(SEARCH)}" aria-label="Search a team">
      ${SEARCH ? '<button class="searchclear" id="clearsearch" aria-label="Clear">✕</button>' : ''}
      <div class="sugg" id="sugg" hidden></div>
    </div>`;
  $('p-board').innerHTML = search + controls +
    `<div id="boardlist">${body}</div>`;
  wire($('p-board'));
  wireSearch();
}

/* Typing only redraws the list, so the input keeps focus and the caret. */
function updateBoardList(){
  const list = visible();
  let rank = 0;
  const box = $('boardlist');
  if(box) box.innerHTML = list.length
    ? list.map(p => ticket(p, p.top_pick ? ++rank : null)).join('')
    : `<div class="empty"><div class="empty-h">NO MATCHES</div>
       <div class="empty-p">${SEARCH ? 'No games for “' + esc(SEARCH) + '”.' : "Nothing matches those filters."}</div></div>`;
  const c = document.querySelector('.count');
  if(c) c.textContent = `${list.length} PICK${list.length===1?'':'S'}`;
  if(box) wire(box);
}

function wireSearch(){
  const inp = $('teamsearch'), sug = $('sugg');
  if(!inp) return;
  const teams = boardTeams();
  let idx = -1;

  const closeSugg = () => { sug.hidden = true; idx = -1; };
  const paint = q => {
    const hits = q ? teams.filter(t => teamMatches(t, q)).slice(0, 8) : [];
    if(!hits.length){ closeSugg(); return; }
    sug.innerHTML = hits.map((t, i) => {
      const m = (DATA.teams || {})[t];
      const dark = document.documentElement.dataset.theme === 'dark';
      const url = m && (dark ? m.logo : (m.logo_dark || m.logo));
      return `<button data-team="${esc(t)}" class="${i===idx?'on':''}">
        ${url ? `<img src="${esc(url)}" alt="">` : ''}<span>${esc(t)}</span></button>`;
    }).join('');
    sug.hidden = false;
    sug.querySelectorAll('[data-team]').forEach(b => b.addEventListener('mousedown', e => {
      e.preventDefault();
      SEARCH = b.dataset.team;
      renderBoard(); renderTop();
    }));
  };

  inp.addEventListener('input', e => { SEARCH = e.target.value; paint(SEARCH); updateBoardList(); });
  inp.addEventListener('focus', () => paint(inp.value));
  inp.addEventListener('blur', () => setTimeout(closeSugg, 120));
  inp.addEventListener('keydown', e => {
    const btns = [...sug.querySelectorAll('[data-team]')];
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if(!btns.length) return;
      idx = e.key === 'ArrowDown' ? Math.min(idx+1, btns.length-1) : Math.max(idx-1, 0);
      btns.forEach((b,i) => b.classList.toggle('on', i===idx));
    } else if(e.key === 'Enter'){
      e.preventDefault();
      const pick = btns[idx] || btns[0];
      if(pick){ SEARCH = pick.dataset.team; renderBoard(); renderTop(); }
    } else if(e.key === 'Escape'){ closeSugg(); }
  });
  const clr = $('clearsearch');
  if(clr) clr.addEventListener('click', () => { SEARCH=''; renderBoard(); renderTop(); });
}

function renderSlip(){
  const picks = allPicks().filter(p => FAVS.has(p.market + ':' + p.game_id));
  if(!picks.length){
    $('p-slip').innerHTML = `<div class="empty"><div class="empty-h">YOUR CARD IS EMPTY</div>
      <div class="empty-p">Tap ☆ on any game to add it here.</div></div>`;
    return;
  }
  const avg = picks.reduce((a,p) => a + Math.abs(p.edge), 0) / picks.length;
  const best = ['A','B','C','D','E'].find(t => picks.some(p => p.tier === t));
  $('p-slip').innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="tile-k">PICKS</div><div class="tile-v">${picks.length}</div></div>
      <div class="tile"><div class="tile-k">AVG EDGE</div><div class="tile-v">${avg.toFixed(1)}</div></div>
      <div class="tile"><div class="tile-k">BEST</div>
        <div class="tile-v" style="font-size:19px">${best ? stars(best) : '—'}</div>
        <div class="tile-sub">${picks.filter(p=>p.qualified).length} qualified</div></div>
    </div>
    <button class="chip" id="clearslip" style="margin:4px 0 8px">Clear card</button>
    ${picks.map(p => ticket(p)).join('')}`;
  wire($('p-slip'));
  $('clearslip').addEventListener('click', () => { FAVS.clear(); renderAll(); });
}

function equityChart(eq){
  if(!eq || eq.length < 3) return '';
  const W=320,H=90,P=4, ys=eq.map(d=>d.units);
  const y0=Math.min(0,...ys), y1=Math.max(0,...ys);
  const px=i=>P+i/Math.max(eq.length-1,1)*(W-2*P);
  const py=v=>H-P-(v-y0)/Math.max(y1-y0,1)*(H-2*P);
  const pts=eq.map((d,i)=>`${px(i).toFixed(1)},${py(d.units).toFixed(1)}`).join(' ');
  const last=ys[ys.length-1];
  return `<div class="chart"><div class="chart-t">UNITS OVER TIME · ${last>0?'+':''}${last.toFixed(1)}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:90px">
      <line x1="0" y1="${py(0)}" x2="${W}" y2="${py(0)}" stroke="var(--rule)"/>
      <polyline points="${pts}" fill="none" stroke="${last>=0?'#4E9A6B':'#B4574F'}"
        stroke-width="2" stroke-linejoin="round"/></svg></div>`;
}

function gapTrend(rows){
  if(!rows || rows.length < 2) return '';
  const W=320,H=132,L=26,R=8,T=10,B=22;
  const vals=rows.flatMap(r=>[r.spread,r.total,r.all,r.spread_raw]).filter(v=>v!=null);
  if(!vals.length) return '';
  const ymax=Math.max(0.4,...vals)*1.15, ymin=Math.min(0,...vals)*1.15;
  const px=i=>L+(rows.length===1?0:i/(rows.length-1)*(W-L-R));
  const py=v=>T+(ymax-v)/Math.max(ymax-ymin,.01)*(H-T-B);
  const hasRaw = rows.some(r => r.spread_raw != null);
  const series=[['spread','#B4892C'],['total','#10739E'],['all','var(--ink)']]
    .concat(hasRaw ? [['spread_raw','#8FA3B4']] : []);
  const lines=series.map(([k,c])=>{
    const pts=rows.map((r,i)=>r[k]==null?null:`${px(i).toFixed(1)},${py(r[k]).toFixed(1)}`).filter(Boolean);
    if(pts.length<2) return '';
    const dots=rows.map((r,i)=>r[k]==null?'':`<circle cx="${px(i).toFixed(1)}" cy="${py(r[k]).toFixed(1)}" r="2.4" fill="${c}"/>`).join('');
    return `<polyline points="${pts.join(' ')}" fill="none" stroke="${c}"
      stroke-width="${k==='all'?2.4:1.6}" stroke-linejoin="round"
      stroke-dasharray="${k==='spread_raw'?'4 3':'none'}"/>${dots}`;
  }).join('');
  const ticks=[ymax,(ymax+ymin)/2,ymin].map(v=>`<text x="${L-5}" y="${py(v)+3}" text-anchor="end"
    font-size="8" fill="currentColor" opacity=".55" font-family="Barlow">${v.toFixed(1)}</text>`).join('');
  const xl=rows.map((r,i)=>`<text x="${px(i).toFixed(1)}" y="${H-6}" text-anchor="middle"
    font-size="8" fill="currentColor" opacity=".55" font-family="Barlow">${esc(String(r.season).slice(2))}</text>`).join('');
  return `<div class="chart" style="color:var(--mute)">
    <div class="chart-t">POINTS BEHIND THE BOOK · LOWER IS BETTER</div>
    <svg viewBox="0 0 ${W} ${H}" style="height:132px">
      <line x1="${L}" y1="${py(0)}" x2="${W-R}" y2="${py(0)}" stroke="#4E9A6B" stroke-dasharray="3 3"/>
      <text x="${W-R}" y="${py(0)-4}" text-anchor="end" font-size="7.5" fill="#4E9A6B"
        font-family="Barlow">MATCHES THE BOOK</text>
      ${ticks}${xl}${lines}</svg>
    <div class="legend"><span><i style="background:#B4892C"></i>Spreads</span>
      <span><i style="background:#10739E"></i>Totals</span>
      <span><i style="background:currentColor"></i>All</span>
      ${hasRaw ? '<span><i style="background:#8FA3B4"></i>Spreads unanchored</span>' : ''}
      </div></div>`;
}

function tierTrend(rows, be, label){
  const W=320,H=118,L=26,R=8,T=10,B=20;
  const vals=rows.map(x=>x.win_pct).filter(v=>v!=null);
  if(vals.length<2) return '';
  const lo=Math.min(be-6,...vals)-2, hi=Math.max(be+6,...vals)+2;
  const px=i=>L+(rows.length===1?0:i/(rows.length-1)*(W-L-R));
  const py=v=>T+(hi-v)/Math.max(hi-lo,.01)*(H-T-B);
  const pts=rows.map((x,i)=>x.win_pct==null?null:`${px(i).toFixed(1)},${py(x.win_pct).toFixed(1)}`).filter(Boolean).join(' ');
  const dots=rows.map((x,i)=>x.win_pct==null?'':`<circle cx="${px(i).toFixed(1)}" cy="${py(x.win_pct).toFixed(1)}"
    r="2.6" fill="${x.win_pct>=be?'#4E9A6B':'#B4574F'}"/>`).join('');
  const xl=rows.map((x,i)=>`<text x="${px(i).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="8"
    fill="currentColor" opacity=".55" font-family="Barlow">${esc(String(x.season).slice(2))}</text>`).join('');
  return `<div class="chart" style="color:var(--mute)">
    <div class="chart-t">${esc(label==='ALL'?'ALL PICKS':label + ' STARS')} · WIN RATE BY SEASON</div>
    <svg viewBox="0 0 ${W} ${H}" style="height:118px">
      <line x1="${L}" y1="${py(be)}" x2="${W-R}" y2="${py(be)}" stroke="#B4892C" stroke-dasharray="3 3"/>
      <text x="${L-5}" y="${py(be)+3}" text-anchor="end" font-size="8" fill="#B4892C"
        font-family="Barlow">${be}</text>
      <polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2"
        stroke-linejoin="round"/>${dots}${xl}</svg></div>`;
}

function seasonTable(rows, live, be){
  if(!rows || !rows.length) return '';
  const all = rows.slice();
  if(live && live.win_pct != null) all.push({season:live.season, bets:live.settled,
    win_pct:live.win_pct, units:live.units, roi_pct:live.roi_pct, _live:true});
  const SPAN = 12;
  return all.map(r => {
    const wp = r.win_pct ?? be, d = Math.max(-SPAN, Math.min(SPAN, wp - be));
    const half = Math.abs(d) / SPAN * 50;
    const style = d >= 0 ? `left:50%;width:${half.toFixed(1)}%;background:#4E9A6B`
                         : `right:50%;width:${half.toFixed(1)}%;background:#B4574F`;
    return `<div class="srow">
      <div class="syear">${esc(r.season)}${r._live?'<span class="live">LIVE</span>':''}</div>
      <div class="sbar"><div class="sbar-mid"></div><div class="sbar-fill" style="${style}"></div></div>
      <div class="sright">${r.win_pct==null?'--':esc(r.win_pct)+'%'}<small>${esc(r.bets)} picks</small></div>
      <div class="sright" style="color:${r.units>0?'#4E9A6B':'#B4574F'}">${r.units>0?'+':''}${esc(r.units)}
        <small>${r.gap!=null?'gap '+esc(r.gap):(r.roi_pct ?? '--')+'%'}</small></div></div>`;
  }).join('');
}

/* Collapsible block. The season is what you check weekly; the backtest is
   reference material and shouldn't push it off the screen. */
function foldSection(key, title, sub, body){
  const open = !!OPEN[key];
  return `
    <button class="fold-h" data-fold="${key}" aria-expanded="${open}">
      <span class="cv">▶</span><span class="t">${esc(title)}</span>
      <span class="s">${esc(sub)}</span>
    </button>
    <div class="fold-b" id="fold-${key}" ${open ? '' : 'hidden'}>${body}</div>`;
}

function renderRecord(){
  const d = DATA, r = d.record || {}, bm = d.record_by_market || {};
  const be = r.breakeven_pct ?? 52.4;
  let h = '';
  if(r.settled){
    h += `<div class="tiles">
      <div class="tile"><div class="tile-k">RECORD</div>
        <div class="tile-v">${r.wins}-${r.losses}${r.pushes?'-'+r.pushes:''}</div>
        <div class="tile-sub">${r.win_pct ?? '--'}% · need ${be}%</div></div>
      <div class="tile"><div class="tile-k">UNITS</div>
        <div class="tile-v ${r.units>0?'pos':r.units<0?'neg':''}">${r.units>0?'+':''}${esc(r.units)}</div>
        <div class="tile-sub">${r.roi_pct ?? '--'}% return</div></div>
      <div class="tile"><div class="tile-k">LINE VALUE</div>
        <div class="tile-v ${r.avg_clv>0?'pos':r.avg_clv<0?'neg':''}">${r.avg_clv==null?'--':(r.avg_clv>0?'+':'')+r.avg_clv}</div>
        <div class="tile-sub">vs closing line</div></div></div>` + equityChart(d.equity);
    const mrow=(l,m)=>m?`<div class="tile"><div class="tile-k">${l}</div>
      <div class="tile-v">${m.wins}-${m.losses}</div>
      <div class="tile-sub">${m.win_pct ?? '--'}% · ${m.units>0?'+':''}${m.units}u</div></div>`:'';
    if(bm.spread||bm.total||bm.top) h += `<h2>BY TYPE</h2><div class="tiles">
      ${mrow('SPREADS',bm.spread)}${mrow('TOTALS',bm.total)}${mrow('TOP',bm.top)}</div>`;
  } else {
    h += `<div class="empty"><div class="empty-h">NO RESULTS YET</div>
      <div class="empty-p">Picks are logged and graded automatically once games finish.</div></div>`;
  }

  /* CLV first: it is the earliest honest read on whether the picks beat the
     number, and it needs far fewer bets than win rate to mean anything. */
  const cbm = d.clv_by_market || {}, cbt = d.clv_by_tier || {};
  if(cbm.all){
    const a = cbm.all;
    const cell = (lab, s) => s ? `
      <div class="tile"><div class="tile-k">${lab}</div>
        <div class="tile-v ${s.avg > 0 ? 'pos' : s.avg < 0 ? 'neg' : ''}">${s.avg > 0 ? '+' : ''}${esc(s.avg)}</div>
        <div class="tile-sub">${esc(s.beat_pct)}% beat · ${esc(s.n)}</div></div>` : '';
    h += `<h2>LINE VALUE</h2>
      <p class="sub">Did the number move toward the pick after it was logged?
      Positive means you took a better price than the market closed at.</p>
      <div class="tiles">
        ${cell('ALL', cbm.all)}${cell('SPREADS', cbm.spread)}${cell('TOTALS', cbm.total)}
      </div>`;
    const tiles = Object.entries(cbt)
      .map(([k, s]) => `<div class="tile"><div class="tile-k">${TIER_STARS[k]}★</div>
        <div class="tile-v ${s.avg > 0 ? 'pos' : s.avg < 0 ? 'neg' : ''}" style="font-size:21px">${s.avg > 0 ? '+' : ''}${esc(s.avg)}</div>
        <div class="tile-sub">${esc(s.n)} picks</div></div>`).join('');
    if(tiles) h += `<div class="tiles">${tiles}</div>`;
    h += `<div class="note">${a.n < 30
      ? `Only ${a.n} graded so far — line value needs about 30 before it says anything.`
      : a.avg > 0.3
        ? `Averaging ${a.avg} points better than the close. That is the signal worth having; keep logging.`
        : a.avg < -0.3
          ? `Averaging ${a.avg} points worse than the close. The market is moving against these picks.`
          : `Flat against the close. No evidence of beating the number yet.`}</div>`;
  }

  /* Everything below is backtest reference, folded away by default so the
     season stays the focus. */
  let hb = '';
  const tsum = d.tier_summary || {}, ttrend = d.tier_trend || {};
  const tks = ['A','B','C','D','E'].filter(k => tsum[k]);
  if(tks.length){
    const opts = tks.concat(['ALL']);
    if(!opts.includes(TIER)) TIER = opts[0];
    const sel = tsum[TIER] || {}, rows = ttrend[TIER] || [];
    hb += `<h2>CONFIDENCE</h2>
      <p class="sub">Five stars is the fifth of picks the model was most sure about,
      one star the least. Break-even is ${esc(be)}%.
      ${d.tier_regime === 'early'
        ? 'Star bands are currently set from <b>early-season</b> history, matching how these ratings were built.'
        : 'Star bands are set from <b>in-season</b> history.'}</p>
      <div class="filters">${opts.map(k =>
        `<button class="chip" data-tier="${k}" aria-pressed="${TIER===k}">${k==='ALL'?'All':TIER_STARS[k]+'★'}</button>`).join('')}</div>
      <div class="tiles">
        <div class="tile"><div class="tile-k">WIN RATE</div>
          <div class="tile-v ${sel.win_pct>=be?'pos':''}">${sel.win_pct ?? '--'}%</div>
          <div class="tile-sub">${esc(sel.bets ?? 0)} picks</div></div>
        <div class="tile"><div class="tile-k">UNITS</div>
          <div class="tile-v ${sel.units>0?'pos':sel.units<0?'neg':''}">${sel.units>0?'+':''}${esc(sel.units ?? '--')}</div>
          <div class="tile-sub">${esc(sel.roi_pct ?? '--')}% return</div></div>
        <div class="tile"><div class="tile-k">AVG EDGE</div>
          <div class="tile-v">${esc(sel.avg_gap ?? '--')}</div>
          <div class="tile-sub">sure ${esc(sel.avg_conf ?? '--')}</div></div></div>`;
    if(rows.length > 1){
      hb += tierTrend(rows, be, TIER === 'ALL' ? 'ALL' : String(TIER_STARS[TIER]));
      const yrs = rows.filter(x => x.win_pct != null);
      const above = yrs.filter(x => x.win_pct >= be).length;
      hb += `<div class="note">Cleared break-even in <b>${above} of ${yrs.length}</b> seasons.
        A rating worth trusting clears it most years, not just on the total.</div>`;
    }
  }

  const bt = d.backtest || {}, ts = d.totals || {};
  if((d.gap_trend || []).length > 1){
    hb += `<h2>ACCURACY TREND</h2>
      <p class="sub">How far behind the book the model landed each season. Falling means improving.</p>`
      + gapTrend(d.gap_trend);
  }
  if((bt.by_season || []).length){
    hb += `<h2>SPREADS BY SEASON</h2>
      <p class="sub">Bars show win rate against the ${esc(be)}% break-even line.</p>`
      + seasonTable(bt.by_season, d.record_live_season, be);
  }
  if((ts.by_season || []).length){
    hb += `<h2>TOTALS BY SEASON</h2>` + seasonTable(ts.by_season, null, be);
  }
  const rawS = (bt.overall || {}).model_mae_raw;
  hb += `<h2>MODEL VS BOOK</h2>
    <p class="sub">Average miss on the final score. Lower is better.
    ${rawS != null ? `<b>Unanchored</b> is the model on its own; the other number is after
    tying predictions to the book's line, which flatters it.` : ''}</p>
    <div class="tiles">
      <div class="tile"><div class="tile-k">SPREADS</div>
        <div class="tile-v">${bt.overall?esc(bt.overall.model_mae):'--'}</div>
        <div class="tile-sub">book ${bt.overall?esc(bt.overall.market_mae):'--'}${
          rawS != null ? ` · unanchored ${esc(rawS)}` : ''}</div></div>
      <div class="tile"><div class="tile-k">TOTALS</div>
        <div class="tile-v">${ts.model_mae!=null?esc(ts.model_mae):'--'}</div>
        <div class="tile-sub">book ${ts.market_mae!=null?esc(ts.market_mae):'--'}</div></div>
      <div class="tile"><div class="tile-k">PAST PICKS</div>
        <div class="tile-v">${bt.qualified_win_pct!=null?esc(bt.qualified_win_pct)+'%':'--'}</div>
        <div class="tile-sub">${bt.qualified_bets ?? '--'} graded</div></div></div>`;


  const seasons = ((d.backtest || {}).seasons || []);
  const span = seasons.length ? `${seasons[0]}–${seasons[seasons.length-1]}` : 'backtest';
  const historyFold = foldSection('history', 'MODEL HISTORY', span, hb);

  const hist = d.history || [];
  if(hist.length){
    const row = x => `
      <div class="rrow"><div class="badge ${esc(x.result)}">${x.result==='push'?'P':x.result==='win'?'W':'L'}</div>
        <div class="rmain"><div class="rpick">${esc(x.pick)} ${x.pick_spread==null?'':sgn(x.pick_spread)}</div>
          <div class="rsub">${esc(x.away)} at ${esc(x.home)}${x.margin==null?'':' · '+sgnInt(x.margin)}</div></div>
        <div class="rsub">${x.clv==null?'':sgn(x.clv)}</div></div>`;
    const RECENT = 12;
    h += `<h2>RESULTS</h2>` + hist.slice(0, RECENT).map(row).join('');
    if(hist.length > RECENT){
      h += foldSection('allpicks', 'EARLIER PICKS',
        `${hist.length - RECENT} more`, hist.slice(RECENT).map(row).join(''));
    }
  }
  // Backtest reference goes last, after this season's results.
  h += historyFold;

  $('p-record').innerHTML = h;
  wire($('p-record'));
}

  const excl = (d.situational || {})._excluded || {}, sit = d.situational || {};

  const gen = d.generated_at ? new Date(d.generated_at) : null;
  const used = Object.entries(sit).filter(([k, v]) =>
    k !== 'rating_scale' && k !== '_excluded' && typeof v === 'number' && Math.abs(v) > 0);

        play, fit across all games at once.</dd>
      <dt>Turnover luck</dt><dd>${st.turnover_points != null
        ? `Each net turnover was worth ${esc(st.turnover_points)} pts;
           ${Math.round((st.turnover_shrink ?? .7) * 100)}% stripped out before rating.`
        : 'Inactive this run.'}</dd>
      <dt>Preseason</dt><dd>Last year's rating, returning production, recruiting, prior-year
        SP+. Fit on ${esc(pm.team_seasons ?? '--')} team-seasons, R² ${esc(pm.r2 ?? '--')}.
        ${st.in_season_weight != null
          ? `Now ${Math.round(st.in_season_weight * 100)}% this season.` : ''}</dd>
      <dt>Totals</dt><dd>Offense and defense rated separately, plus wind, cold, rain.
        ${st.uses_weather
          ? `${esc(st.weather_games ?? 0)} games have weather, ${esc(st.domes ?? 0)} venues indoors.`
          : 'Weather still loading.'}</dd>
      <dt>Home field</dt><dd>${esc(st.home_field ?? '--')} pts, measured not assumed.</dd>
      <dt>Situational</dt><dd>${used.length
        ? used.map(([k, v]) => `${esc(k.replace(/_/g, ' '))} ${v > 0 ? '+' : ''}${esc(v)}`).join(' · ')
        : 'None survived testing this run — travel, rest and rivalry all contribute zero.'}</dd>
    </dl>`;

  const honest = `
    <dl>
      <dt>Why picks aren't all underdogs</dt><dd>The model's ratings sit closer to average
        than the market's, so it under-rates big favourites and an "edge" appears on every
        dog. ${db.slope != null ? `Raw predictions ran at <b>${esc(db.slope)}×</b> the book's
        scale; that line is subtracted.` : ''}</dd>
      <dt>Line vs edge</dt><dd>${bias.edge_vs_line_corr != null
        ? `<b>${esc(bias.edge_vs_line_corr)}</b>. Near zero is healthy.` : '--'}</dd>
      <dt>This week's board</dt><dd>${['spread', 'total'].map(k => {
          const b = bal[k]; return b ? `${k === 'spread' ? 'Spreads' : 'Totals'}
          <b>${esc(b.pct)}%</b> ${esc(b.side)}` : ''; }).filter(Boolean).join(' · ') || '--'}
        ${' '}· 50% is balanced.</dd>
      <dt>Totals history</dt><dd>${tbias.pct_over != null
        ? `${esc(tbias.pct_over)}% overs, correlation ${esc(tbias.edge_vs_line_corr ?? '--')}.`
        : '--'}</dd>
      <dt>The cost</dt><dd>Anchoring to the book improves the accuracy figure without the
        model earning it. <b>Judge by win rate and line value.</b></dd>
    </dl>`;

  const qbRows = Object.entries(qb).sort((a, b) => b[1].points - a[1].points).slice(0, 20)
    .map(([team, v]) => `<div class="rrow">
      <div class="rmain"><div class="rpick">${esc(team)}</div>
        <div class="rsub">${esc(v.starter)} over ${esc(v.backup)}${v.estimated ? ' (est)' : ''}</div></div>
      <div class="num" style="font-size:14px;color:var(--gold)">${esc(v.points)}</div></div>`).join('');
  const qbBody = `<p class="sub">Points per game lost if the starter sits, from his EPA per
    play minus his backup's. <b>Not in the model</b> — apply by hand when you see news${
    d.qb_season ? `. Based on ${esc(d.qb_season)} usage` : ''}.</p>
    ${qbRows || '<p class="sub">Not available this run.</p>'}`;

  const dropped = `<p class="sub">Effects the data wouldn't support. Dropping beats trusting
    a number that says jet lag helps.</p><dl>${Object.keys(excl).length
    ? Object.entries(excl).map(([k, w]) =>
        `<dt>${esc(k.replace(/_/g, ' '))}</dt><dd>${esc(w)}</dd>`).join('')
    : '<dd>Nothing dropped this run.</dd>'}</dl>`;

  const limits = `
    <dl>
      <dt>No injuries</dt><dd>Biggest gap. See QB value above.</dd>
      ${SPORT === 'nfl'
        ? `<dt>Small sample</dt><dd>272 regular-season games a year against roughly 800 in
             college. Every number here carries wider error bars, and one season proves
             nothing.</dd>
           <dt>Sharpest market there is</dt><dd>NFL lines are the most heavily bet and most
             efficiently priced in sport. Beating them is harder than college.</dd>`
        : `<dt>No transfer portal</dt><dd>Incoming transfers aren't counted. Worst in September.</dd>`}
      <dt>Consensus lines</dt><dd>Not your book. Half a point matters.</dd>
      <dt>Past ≠ future</dt><dd>${bt.qualified_win_pct != null
        ? `Qualified picks hit ${esc(bt.qualified_win_pct)}% historically vs ${esc(be)}% break-even.`
        : 'Backtest pending.'}</dd>
      <dt>Held-out season</dt><dd>${bt.holdout && bt.holdout.win_pct != null
        ? `${esc(bt.holdout.season)} scored ${esc(bt.holdout.win_pct)}%, but it has been
           examined repeatedly since. The live season is the clean test now.`
        : '--'}</dd>
    </dl>`;

  const refresh = `
    <dl>
      <dt>Automatic</dt><dd>Twice daily (early morning and late morning), two more
        passes Saturday, Sunday to grade. Nothing to trigger.</dd>
      <dt>Timing drifts</dt><dd>GitHub runs these on shared capacity and can delay them
        by an hour or more, occasionally skipping one. That is why there are two attempts
        a day — <b>a late update is normal, a missing one is not.</b></dd>
      <dt>Reloading</dt><dd>Fetches the latest saved numbers; it does not re-run the model.</dd>
      <dt>Force a run</dt><dd>GitHub → Actions → Update model → Run workflow. Worth it if a
        starter is ruled out or a number moves hard.</dd>
      <dt>Later weeks</dt><dd>Games appear once a book posts a number.</dd>
      <dt>Your card</dt><dd>Clears on reload, by design.</dd>
      <dt>Last update</dt><dd>${gen ? esc(gen.toLocaleString()) : '--'}</dd>
    </dl>`;

  const ratings = (d.ratings || []).slice(0, 25).map(r => `
    <div class="rrow"><div class="rsub" style="width:22px;text-align:right">${r.rank}</div>
      <div class="rmain"><div class="rpick">${esc(r.team)}</div></div>
      <div class="rsub">${sgn(r.rating)}</div></div>`).join('');

  $('p-model').innerHTML = `
    <h2>THE MODEL</h2>
    <p class="sub">Rates every ${SPORT === 'nfl' ? 'NFL' : 'college'} team, prices every game,
    compares its number to the book's, and tracks every pick it flags.
    ${SPORT === 'nfl' ? 'Data from nflverse.' : 'Data from the College Football Data API.'}</p>
    ${(d.notes || []).map(n => `<div class="note warn">${esc(n)}</div>`).join('')}
    ${foldSection('m1', 'READING A CARD', '', card)}
    ${foldSection('m2', 'READING THE RECORD', '', record)}
    ${foldSection('m3', 'HOW IT WORKS', '', how)}
    ${foldSection('m4', 'KEEPING PICKS HONEST', '', honest)}
    ${foldSection('m5', 'QB VALUE', Object.keys(qb).length ? `${Object.keys(qb).length} teams` : '', qbBody)}
    ${foldSection('m6', 'DROPPED', Object.keys(excl).length ? `${Object.keys(excl).length}` : '', dropped)}
    ${foldSection('m7', 'LIMITS', '', limits)}
    ${foldSection('m8', 'REFRESHING', '', refresh)}
    ${foldSection('m9', 'TOP 25', '', ratings || '<p class="sub">Not available.</p>')}`;
  wire($('p-model'));
}

/* ---------- shareable card ----------
   Built to fit a single phone screenshot: abbreviations, tight rows, and the
   whole thing capped so it never runs past one screen. */
function shortName(name){
  const m = (DATA.teams || {})[name];
  if(m && m.abbr && m.abbr.length <= 5) return m.abbr;
  return name.length > 14 ? name.slice(0, 13) + '…' : name;
}

function renderShare(){
  const bw = DATA.board_week;
  const picks = allPicks()
    .filter(p => p.qualified && (bw == null || p.week == null || p.week === bw))
    .sort((a,b) => (b.confidence ?? 0) - (a.confidence ?? 0))
    .slice(0, SHARE_N);
  const d = DATA;
  const when = new Date(d.generated_at);
  const wk = picks.length && picks[0].week != null
    ? 'WEEK ' + String(picks[0].week).padStart(2,'0') : '';

  const rows = picks.map((p, i) => {
    const isTot = p.market === 'total';
    const line = isTot ? Number(p.line).toFixed(1) : sgn(p.pick_spread);
    const n = TIER_STARS[p.tier] || 0;
    return `<div class="sc-row">
      <div class="sc-n">${i+1}</div>
      <div class="sc-g">
        <div class="sc-p">${esc(isTot ? p.pick.toUpperCase() + ' ' + shortName(p.home) : p.pick)}</div>
        <div class="sc-m">${esc(shortName(p.away))} AT ${esc(shortName(p.home))}${isTot ? ' · TOTAL' : ''}</div>
      </div>
      <div class="sc-r"><div class="sc-line">${esc(line)}</div>
        <div class="sc-st">${'★'.repeat(n)}<span class="off">${'☆'.repeat(5-n)}</span></div></div>
    </div>`;
  }).join('');

  $('sharecard').innerHTML = `
    <div class="sc-head">
      <div><div class="sc-the">THE</div><div class="sc-card">${SPORT === 'nfl' ? 'PRO CARD' : 'CARD'}</div></div>
      <div class="sc-meta">${esc(wk)}<br>${esc(when.toLocaleDateString([], {month:'short', day:'numeric'}).toUpperCase())}
        <br>TOP ${picks.length}</div>
    </div>
    ${rows || '<div class="sc-row"><div class="sc-g"><div class="sc-p">NO QUALIFIED PICKS</div></div></div>'}
    <div class="sc-foot">
      <div class="sc-tag">READ THE CARD</div>
      <div class="sc-note">NEED ${esc((d.record || {}).breakeven_pct ?? 52.4)}% TO BREAK EVEN</div>
    </div>
    <div class="fold"></div>`;
}

/* A failed run leaves stale numbers up quietly. This makes that loud. */
function renderStale(){
  const box = $('staleban');
  if(!box) return;
  const gen = DATA && DATA.generated_at ? new Date(DATA.generated_at) : null;
  if(!gen || isNaN(gen)){ box.innerHTML = ''; return; }

  const hrs = (Date.now() - gen) / 36e5;
  if(hrs < 36){ box.innerHTML = ''; return; }   // daily schedule plus slack

  const days = Math.floor(hrs / 24);
  const age = days >= 1 ? `${days} day${days === 1 ? '' : 's'}` : `${Math.round(hrs)} hours`;
  const bad = hrs >= 96;
  box.innerHTML = `
    <div class="stale ${bad ? 'bad' : 'warn'}">
      <span class="stale-i">${bad ? '!' : '·'}</span>
      <div><b>These numbers are ${esc(age)} old.</b>
        ${bad ? 'The daily update has not run in a while, so lines and picks below are out of date.'
              : 'The daily update looks like it was missed. Lines may have moved since.'}
        <small>CHECK GITHUB → ACTIONS FOR A FAILED RUN</small></div>
    </div>`;
}

function applyBrand(){
  const s = SPORTS[SPORT];
  const dark = document.documentElement.dataset.theme === 'dark';
  const img = $('brandimg'), fb = $('brandfallback');
  document.documentElement.dataset.sport = SPORT;
  document.title = s.label;
  img.alt = s.alt;
  img.onerror = () => { img.hidden = true; fb.hidden = false; };
  img.onload  = () => { img.hidden = false; fb.hidden = true; };
  img.hidden = false; fb.hidden = true;
  // the pro lockup ships in two versions; the dark one is built for a navy page
  img.src = dark ? s.logoDark : s.logo;
  $('sharebtn').textContent = SPORT === 'nfl' ? 'THE PRO CARD' : 'THE CARD';
  $('s-cfb').setAttribute('aria-selected', SPORT === 'cfb');
  $('s-nfl').setAttribute('aria-selected', SPORT === 'nfl');
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content',
    SPORT === 'nfl' ? (dark ? '#0B2541' : '#F6F0DD') : (dark ? '#0C1B29' : '#EFECE6'));
}

/* Every panel must be emptied on a sport switch. Leaving the previously
   rendered ones in place meant college results stayed on screen under a pro
   header until — or unless — the new fetch resolved. */
function clearPanels(head, body){
  const block = `<div class="empty"><div class="empty-h">${esc(head)}</div>
    ${body ? `<div class="empty-p">${body}</div>` : ''}</div>`;
  ['p-board', 'p-slip', 'p-record', 'p-model'].forEach(id => { $(id).innerHTML = block; });
  $('stamp').textContent = '';
  $('staleban').innerHTML = '';
  $('t-board').textContent = 'GAMES';
  $('t-slip').innerHTML = 'YOUR CARD';
}

function loadSport(sport){
  SPORT = sport;
  DATA = null;
  applyBrand();
  FAVS.clear();
  CONF = 'all'; WEEKS = 'this'; SEARCH = ''; SORT = 'confidence'; TIER = 'A';
  FILTERS.market = 'all'; FILTERS.quality = 'all';
  OPEN.history = false; OPEN.allpicks = false; OPEN.historyTouched = false;

  if(CACHE[sport]){ DATA = CACHE[sport]; renderAll(); return; }
  clearPanels('LOADING');
  fetch(SPORTS[sport].file + '?t=' + Date.now())
    .then(r => {
      if(!r.ok) throw new Error('not found');
      const type = r.headers && r.headers.get && r.headers.get('content-type');
      if(type && type.indexOf('json') === -1) throw new Error('not found');
      return r.text();
    })
    .then(txt => {
      // some hosts answer a missing file with the page itself
      if(txt.trim().slice(0, 1) === '<') throw new Error('not found');
      return JSON.parse(txt);
    })
    .then(d => {
      // guard against a stale response landing after another switch
      if(SPORT !== sport) return;
      CACHE[sport] = d; DATA = d; renderAll();
    })
    .catch(e => {
      if(SPORT !== sport) return;
      DATA = null;
      const known = e.message === 'not found';
      clearPanels(sport === 'nfl' ? 'NO PRO DATA YET' : 'NO DATA YET',
        (sport === 'nfl'
          ? "The pro model hasn't run yet. GitHub → Actions → Update model → Run workflow."
          : 'Run the update workflow in GitHub.') +
        (known ? '' : `<br><span style="font-family:var(--data);font-size:11px">${esc(e.message)}</span>`));
    });
}

function renderTop(){
  renderStale();
  const d = DATA, t = new Date(d.generated_at);
  $('stamp').textContent = 'UPDATED ' +
    t.toLocaleDateString([], {month:'short', day:'numeric'}).toUpperCase() + ' ' +
    t.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  const live = allPicks();
  /* The pick count already appears in the filter bar, and squeezing it into the
     tab was what pushed the label out of its box. */
  $('t-board').textContent = 'GAMES';
  $('t-slip').innerHTML = FAVS.size
    ? `YOUR CARD<span class="n">${FAVS.size}</span>` : 'YOUR CARD';
}

function wire(root){
  root.querySelectorAll('[data-fav]').forEach(b => b.addEventListener('click', () => {
    const id=b.dataset.fav; FAVS.has(id)?FAVS.delete(id):FAVS.add(id); renderAll();
  }));
  root.querySelectorAll('.chip[data-f]').forEach(c => c.addEventListener('click', () => {
    const g = c.dataset.f, v = c.dataset.v;
    // Spreads and Totals toggle: tapping the active one clears back to both,
    // so All/Qualified combine freely with either market or neither.
    FILTERS[g] = (g === 'market' && FILTERS[g] === v) ? 'all' : v;
    renderBoard(); renderTop();
  }));
  root.querySelectorAll('[data-tier]').forEach(b => b.addEventListener('click', () => {
    TIER=b.dataset.tier; renderRecord();
  }));
  root.querySelectorAll('[data-fold]').forEach(b => b.addEventListener('click', () => {
    const k=b.dataset.fold;
    OPEN[k]=!OPEN[k];
    if(k==='history') OPEN.historyTouched = true;
    const box=root.querySelector('#fold-'+k);
    if(box){ if(OPEN[k]) box.removeAttribute('hidden'); else box.setAttribute('hidden',''); }
    b.setAttribute('aria-expanded', OPEN[k]);
  }));
  root.querySelectorAll('[data-info]').forEach(b => b.addEventListener('click', () => {
    const box=root.querySelector('#why-'+CSS.escape(b.dataset.info));
    if(!box) return;
    const open=box.hasAttribute('hidden');
    if(open) box.removeAttribute('hidden'); else box.setAttribute('hidden','');
    b.setAttribute('aria-expanded', open);
  }));
  const sel=root.querySelector('#sortsel');
  if(sel) sel.addEventListener('change', e => { SORT=e.target.value; renderBoard(); });
  const cf=root.querySelector('#confsel');
  root.querySelectorAll('[data-weeks]').forEach(b => b.addEventListener('click', () => {
    WEEKS = WEEKS === 'this' ? 'all' : 'this';
    renderBoard(); renderTop();
  }));
  if(cf) cf.addEventListener('change', e => { CONF=e.target.value; renderBoard(); renderTop(); });
}

function renderAll(){ renderTop(); renderBoard(); renderSlip(); renderRecord(); renderModel(); }

/* ---------- navigation ---------- */
const TABS=[['t-board','p-board','board'],['t-slip','p-slip','slip'],['t-record','p-record','record']];
function show(view){
  VIEW=view;
  TABS.forEach(([t,p,v]) => { $(t).setAttribute('aria-selected', v===view); $(p).hidden = v!==view; });
  $('p-model').hidden = view !== 'model';
  $('m-model').setAttribute('aria-selected', view === 'model');
  window.scrollTo({top:0,behavior:'instant'});
}
TABS.forEach(([tid,,v]) => $(tid).addEventListener('click', () => show(v)));
$('menubtn').addEventListener('click', () => $('drawer').hidden = false);
$('closemenu').addEventListener('click', () => $('drawer').hidden = true);
$('drawer').addEventListener('click', e => { if(e.target === $('drawer')) $('drawer').hidden = true; });
$('m-model').addEventListener('click', () => { show('model'); $('drawer').hidden = true; });

function openShare(){ renderShare(); $('sheet').hidden = false; }
$('sharebtn').addEventListener('click', openShare);
$('m-card').addEventListener('click', () => { $('drawer').hidden = true; openShare(); });
$('closesheet').addEventListener('click', () => $('sheet').hidden = true);
$('sheet').addEventListener('click', e => { if(e.target === $('sheet')) $('sheet').hidden = true; });
$('sharemore').addEventListener('click', e => {
  SHARE_N = SHARE_N === 10 ? 5 : 10;
  e.target.setAttribute('aria-pressed', SHARE_N === 5);
  renderShare();
});


function setTheme(mode){
  document.documentElement.dataset.theme = mode;
  if(typeof applyBrand === 'function' && $('brandimg')) applyBrand();
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', mode === 'dark' ? '#0C1B29' : '#EFECE6');
  if(DATA) renderAll();
}
const toggleTheme = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('themebtn').addEventListener('click', toggleTheme);


/* Start on the device's preference, then the toggle takes over for the session. */
const prefersLight = typeof matchMedia === 'function'
  && matchMedia('(prefers-color-scheme: light)').matches;
setTheme(prefersLight ? 'light' : 'dark');

$('s-cfb').addEventListener('click', () => { if(SPORT !== 'cfb') loadSport('cfb'); });
$('s-nfl').addEventListener('click', () => { if(SPORT !== 'nfl') loadSport('nfl'); });

loadSport('cfb');
</script>
